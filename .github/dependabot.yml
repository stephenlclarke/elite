version: 2
updates:
  - package-ecosystem: swift
    directory: /
    target-branch: main
    schedule:
      interval: daily
      time: "09:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      swift-routine:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: daily
      time: "09:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-routine:
        update-types: [minor, patch]
