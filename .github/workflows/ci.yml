name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: elite-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    # Untrusted events stay hosted and fail closed before any checkout. The physical
    # runner also has a host-owned, exact-head pre-job hook outside this repository.
    runs-on: ${{ github.repository == 'stephenlclarke/elite' && github.actor_id == '22142777' && vars.ELITE_NATIVE_RUNNER_ENABLED == 'true' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.id == 22142777 || github.event_name == 'workflow_dispatch') && fromJSON('["self-hosted", "macOS", "ARM64", "elite-native"]') || 'macos-15' }}
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - name: Require host authorization before checkout
        run: |
          python3 - <<'PYTHON'
          import os, re
          if os.environ.get('RUNNER_ENVIRONMENT') != 'self-hosted':
              raise SystemExit('Required native quality needs an authorized physical runner; no checkout performed.')
          if not re.fullmatch(r'[0-9a-f]{40}', os.environ.get('ELITE_NATIVE_APPROVED_HEAD', '')):
              raise SystemExit('The host-owned exact-head authorization hook did not run.')
          PYTHON
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: false
      - name: Verify physical source, toolchain and owned build cache
        run: python3 Tools/CI/native_runner.py --checkout
      - name: Coverage, thread sanitizer, address sanitizer, and leak probe
        run: python3 Tools/CI/capture-quality.py
      - name: Install SonarScanner
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: brew install sonar-scanner
      - name: Analyze main in SonarQube
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: make sonar
      - name: Upload coverage and runtime diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: elite-quality-evidence
          path: |
            coverage.xml
            reports/
