name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: elite-${{ github.ref }}
  cancel-in-progress: false
jobs:
  phases:
    name: Native quality components
    uses: ./.github/workflows/recoverable-quality.yml
    with:
      enable_native: true
    secrets: inherit
  quality:
    # Preserve the required check name. Only the real component workflow can qualify it.
    name: quality
    needs: phases
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all native and prerequisite results
        env:
          COMPONENTS: ${{ needs.phases.result }}
        run: |
          test "$COMPONENTS" = success
          echo 'All required exact-head quality components passed.' >> "$GITHUB_STEP_SUMMARY"
