name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: elite-main
  cancel-in-progress: false
jobs:
  quality:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Coverage, thread sanitizer, address sanitizer, and leak probe
        run: make ci
      - name: Install SonarScanner
        run: brew install sonar-scanner
      - name: Analyze main in SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: make sonar
      - name: Upload coverage and runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elite-quality-evidence
          path: |
            coverage.xml
            reports/
