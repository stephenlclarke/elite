name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: elite-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Coverage, thread sanitizer, address sanitizer, and leak probe
        run: python3 Tools/CI/capture-quality.py
      - name: Install SonarScanner
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: brew install sonar-scanner
      - name: Analyze main in SonarQube
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: make sonar
      - name: Upload coverage and runtime diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: elite-quality-evidence
          path: |
            coverage.xml
            reports/
