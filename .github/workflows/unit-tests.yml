name: M01 retained-image diagnostic (unmerged)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: m01-retained-392e-diagnostic
  cancel-in-progress: false
jobs:
  retained-fault:
    if: github.ref == 'refs/heads/diagnostic/station-a561-retained-fault'
    runs-on: macos-15
    timeout-minutes: 12
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download the original failed run's retained image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reports/m01-retained-replay
          gh api repos/stephenlclarke/elite/actions/runs/39812579729 > reports/m01-retained-replay/upstream-run.json
          gh run download 39812579729 --repo stephenlclarke/elite --name isolated-units-392e9ccaf873f8709cb7ae083dea91ac8ca8ca99 --dir .build/m01-replay-original
      - name: Verify source, runtime, original selection, image and resources
        run: python3 Tools/CI/replay_m01_392e.py prepare
      - name: One retained-image LLDB launch (300 seconds, diagnostic only)
        run: |
          xcrun lldb --no-lldbinit --batch \
            -o 'command script import Tools/CI/replay_m01_392e.py' \
            -o 'script replay_m01_392e.capture(lldb.debugger)' \
            > reports/m01-retained-replay/lldb.log 2>&1
          python3 Tools/CI/replay_m01_392e.py outcome
      - name: Upload diagnostic evidence (never a qualification report)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m01-392e-retained-fault-${{ github.run_id }}
          path: reports/m01-retained-replay/
          if-no-files-found: error
