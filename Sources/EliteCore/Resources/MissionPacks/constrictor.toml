schemaVersion = 1
id = "xyzzy.constrictor"
version = "1.0.0"
minimumEngine = "1.0.0"
capabilities = ["state-machine-v1", "dialog-v1", "economy-v1", "cargo-v1"]
priority = 0
source = "BBC Micro Executive source / project adaptation"
license = "Original narrative rights retained; see NOTICE.md"

[mission]
id = "constrictor"
title = "Constrictor Hunt"
initialStage = "not-started"
binding = "naval"
briefing = "The Navy's experimental warship has been stolen. Follow system reports across the first two galaxies. Its shields require military lasers; it carries ECM. Optional clues do not count as required milestones."
destination = "Galaxies 1 and 2. Spoiler: Orarra, Galaxy 2 (144,33). Debrief at a station."
reward = "5,000 CR and 256 combat points, awarded on docking after target removal."
prerequisites = ["Combat points: {kills} of 256 required to receive orders.", "Receive orders while docked in Galaxy 1 or 2. Current: {galaxy}."]
milestones = ["Receive naval assignment", "Remove the Constrictor", "Dock for debriefing and reward"]

[[stages]]
id = "not-started"
objective = "Find and remove the stolen Constrictor, then report to the Navy."
completed = 0
legacyValues = [0]
legacyWrite = 0

[[stages]]
id = "hunt"
objective = "Find and remove the stolen Constrictor, then report to the Navy."
completed = 1
legacyValues = [1]
legacyWrite = 1

[[stages]]
id = "report"
objective = "Dock for your naval debriefing."
completed = 2
legacyValues = [3]
legacyWrite = 3

[[stages]]
id = "complete"
objective = "Constrictor Hunt complete."
completed = 3
legacyValues = [2, 6, 10, 14]
legacyWrite = 2
terminal = true

[[dialogs]]
id = "constrictorbriefing"
text = "COMMANDER {commander},\nCAPTAIN {captain}, SPACE NAVY.\n\nTHE CONSTRICTOR IS AN EXPERIMENTAL WARSHIP WITH SECRET SHIELD TECHNOLOGY. IT WAS STOLEN FROM OUR XEER SHIPYARD FIVE MONTHS AGO.\n\n{sighting}\n\nFIND AND DESTROY IT. ONLY MILITARY LASERS CAN DAMAGE ITS SHIELDS, AND IT CARRIES ECM. A GENEROUS REWARD AWAITS YOU.\n\nMESSAGE ENDS"
ship = true
delaySeconds = 2.0

[[dialogs]]
id = "constrictordebriefing"
text = "COMMANDER {commander},\n\nTHE STOLEN CONSTRICTOR IS NO LONGER A THREAT. THE NAVY THANKS YOU FOR YOUR SERVICE.\n\nYOUR ACCOUNT HAS BEEN CREDITED WITH 5,000 CR AND YOUR COMBAT TALLY INCREASED BY 256 POINTS.\n\nMESSAGE ENDS"
ship = false
delaySeconds = 2.0

[[transitions]]
id = "briefing"
from = "not-started"
event = "dock"
to = "hunt"
conditions = [{ field = "kills", op = "ge", value = 256 }, { field = "galaxy", op = "lt", value = 2 }]
actions = []
dialog = "constrictorbriefing"

[[transitions]]
id = "removal"
from = "hunt"
event = "targetRemoved"
to = "report"
conditions = [{ field = "target", op = "eq", text = "constrictor" }]
actions = []

[[transitions]]
id = "debrief"
from = "report"
event = "dock"
to = "complete"
conditions = []
actions = [{ kind = "creditsWrapped", amount = 50000 }, { kind = "killsWrapped", amount = 256 }]
dialog = "constrictordebriefing"

