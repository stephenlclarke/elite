schemaVersion = 1
id = "xyzzy.blackjack"
version = "1.0.0"
minimumEngine = "1.0.0"
capabilities = ["state-machine-v1", "dialog-v1", "economy-v1", "cargo-v1"]
priority = 10
source = "Blackjack\u2019s Bullion Oolite 1.2.9; project station transfer adaptation"
license = "Original narrative rights retained; see NOTICE.md"

[mission]
id = "blackjack"
title = "Blackjack's Bullion"
initialStage = "not-started"
binding = "blackjack"
briefing = "A recovered Oolite 1.2.9 campaign: revenge, a dockside firearm transfer, a witness chase and final report. No score gate or deadline. This project replaces the station robbery with explicit Confirm/Back transfers and repairs witness, custody, wanted-level and duplicate-reward defects."
destination = "Spoilers, Galaxy 2: Telace 241 > Gerebied 88 > any main station > Tegete 233 > Ceinerxe 127 > Edater 99 > Esdi 67. System IDs are zero-based."
reward = "20 kg gold earned directly on Bolts death, then 9,500 CR and one-time bounty clearance at Esdi. Gold is not a scoop objective."
prerequisites = ["Galaxy 2 main-station contact at Telace. No combat-score prerequisite.", "One free tonne is required at Tegete. Marked firearms cannot be sold or stored.", "Seven chronological milestones; optional clues are not progress."]
milestones = ["Receive Blackjack's contact", "Destroy Bolts; earn 20 kg gold", "Report at a G2 main station", "Collect the marked firearm", "Confirm Ceinerxe dockside handoff", "Destroy the unique witness", "Confirm Esdi report and final reward"]

[[stages]]
id = "not-started"
objective = "Dock at Telace's main station in Galaxy 2 for Blackjack's contact."
completed = 0
legacyValues = [0]
legacyWrite = 0

[[stages]]
id = "hunt-bolts"
objective = "Destroy the unique Commander Bolts at Gerebied, Galaxy 2. Any killer counts."
completed = 1
legacyValues = [1]
legacyWrite = 1

[[stages]]
id = "report-bolts"
objective = "Report at any main station in Galaxy 2. Collect pending gold first if needed."
completed = 2
legacyValues = [2]
legacyWrite = 2

[[stages]]
id = "collect-firearm"
objective = "Collect the one-tonne marked firearm at Tegete's main station, Galaxy 2."
completed = 3
legacyValues = [3]
legacyWrite = 3

[[stages]]
id = "deliver-firearm"
objective = "Deliver the marked firearm through Ceinerxe's dockside handoff, Galaxy 2."
completed = 4
legacyValues = [4]
legacyWrite = 4

[[stages]]
id = "hunt-witness"
objective = "Destroy the unique witness at Edater, Galaxy 2. Any killer counts."
completed = 5
legacyValues = [5]
legacyWrite = 5

[[stages]]
id = "report-witness"
objective = "Confirm the final report at Esdi's main station, Galaxy 2, for 9,500 CR and bounty clearance."
completed = 6
legacyValues = [6]
legacyWrite = 6

[[stages]]
id = "complete"
objective = "Blackjack's Bullion complete. No further reward or bounty clearance is available."
completed = 7
legacyValues = [99]
legacyWrite = 99
terminal = true

[[dialogs]]
id = "introduction"
text = "Blackjack asks you to find Commander Bolts at Gerebied, Galaxy 2. Destroying the unique target earns 20 kg gold, regardless of the killer. Then report at any main station in Galaxy 2. No deadline. This contact has enrolled you; Continue or Back closes this message."

[[dialogs]]
id = "report"
text = "Confirm your report to Blackjack. Next: collect one tonne of marked mission firearms at Tegete's main orbital station, Galaxy 2. No payment or item transfer here."

[[dialogs]]
id = "collectfirearm"
text = "Transfer one tonne of marked firearms from Blackjack's contact into your hold. One free tonne is required. Keep this mission item aboard until Ceinerxe's main orbital station. Personal cargo and equipment stay aboard."

[[dialogs]]
id = "robbery"
text = "Transfer the marked firearm to Blackjack at Ceinerxe's dockside handoff. This completes the station operation, makes you wanted (minimum 64), and directs you to the witness at Edater, Galaxy 2. No on-foot operation is played."

[[dialogs]]
id = "finalreport"
text = "Report the witness's destruction at Esdi. Confirm to receive 9,500 CR and clear your bounty once. The campaign then ends. Later offences will remain yours."

[[dialogs]]
id = "collectgold"
text = "Your once-earned 20 kg gold is pending collection. Make room for the gold before confirming. This is not a second reward."

[[transitions]]
id = "enrol"
from = "not-started"
event = "contact"
to = "hunt-bolts"
conditions = [{ field = "galaxy", op = "eq", value = 1 }, { field = "mainStation", op = "eq", value = 1 }, { field = "system", op = "eq", value = 241 }]
actions = [{ kind = "receipt", key = "contact" }]
dialog = "introduction"

[[transitions]]
id = "bolts-death"
from = "hunt-bolts"
event = "targetDestroyed"
to = "report-bolts"
conditions = [{ field = "target", op = "eq", text = "bolts" }]
actions = [{ kind = "receipt", key = "goldAward" }, { kind = "cargoRewardOrPending", key = "13", amount = 20 }]
notification = "20 KG GOLD AWARDED - REPORT AT A GALAXY 2 STATION"

[[transitions]]
id = "gold"
from = "report-bolts"
event = "contact"
to = "report-bolts"
conditions = [{ field = "galaxy", op = "eq", value = 1 }, { field = "mainStation", op = "eq", value = 1 }, { field = "flag:pendingGold", op = "eq", value = 1 }]
actions = [{ kind = "cargoAdd", key = "13", amount = 20 }, { kind = "flagSet", key = "pendingGold", amount = 0 }, { kind = "receipt", key = "goldDelivery" }]
dialog = "collectgold"
confirmation = true

[[transitions]]
id = "report"
from = "report-bolts"
event = "contact"
to = "collect-firearm"
conditions = [{ field = "galaxy", op = "eq", value = 1 }, { field = "mainStation", op = "eq", value = 1 }, { field = "flag:pendingGold", op = "eq", value = 0 }]
actions = [{ kind = "receipt", key = "report" }]
dialog = "report"
confirmation = true

[[transitions]]
id = "firearm"
from = "collect-firearm"
event = "contact"
to = "deliver-firearm"
conditions = [{ field = "galaxy", op = "eq", value = 1 }, { field = "mainStation", op = "eq", value = 1 }, { field = "system", op = "eq", value = 233 }]
actions = [{ kind = "cargoAdd", key = "10", amount = 1 }, { kind = "receipt", key = "firearmPickup" }]
dialog = "collectfirearm"
confirmation = true

[[transitions]]
id = "robbery"
from = "deliver-firearm"
event = "contact"
to = "hunt-witness"
conditions = [{ field = "galaxy", op = "eq", value = 1 }, { field = "mainStation", op = "eq", value = 1 }, { field = "system", op = "eq", value = 127 }]
actions = [{ kind = "cargoRemove", key = "10", amount = 1 }, { kind = "receipt", key = "robberyHandoff" }, { kind = "legalFloor", amount = 64 }]
dialog = "robbery"
confirmation = true

[[transitions]]
id = "witness-death"
from = "hunt-witness"
event = "targetDestroyed"
to = "report-witness"
conditions = [{ field = "target", op = "eq", text = "witness" }]
actions = []
notification = "WITNESS DESTROYED - REPORT AT ESDI, GALAXY 2"

[[transitions]]
id = "reward"
from = "report-witness"
event = "contact"
to = "complete"
conditions = [{ field = "galaxy", op = "eq", value = 1 }, { field = "mainStation", op = "eq", value = 1 }, { field = "system", op = "eq", value = 67 }]
actions = [{ kind = "credits", amount = 95000 }, { kind = "legalSet", amount = 0 }, { kind = "receipt", key = "finalReward" }]
dialog = "finalreport"
confirmation = true
notification = "BLACKJACK COMPLETE - 9500 CR RECEIVED"

[[encounters]]
id = "bolts"
stage = "hunt-bolts"
galaxy = 1
system = 88
kind = "blackjack-target"

[[encounters]]
id = "witness"
stage = "hunt-witness"
galaxy = 1
system = 99
kind = "blackjack-target"
