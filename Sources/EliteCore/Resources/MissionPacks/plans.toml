schemaVersion = 1
id = "xyzzy.plans"
version = "1.0.0"
minimumEngine = "1.0.0"
capabilities = ["state-machine-v1", "dialog-v1", "economy-v1", "cargo-v1"]
priority = 1
source = "BBC Micro Executive source / project adaptation"
license = "Original narrative rights retained; see NOTICE.md"

[mission]
id = "plans"
title = "Thargoid Plans"
initialStage = "not-started"
binding = "naval"
briefing = "Naval Intelligence needs a courier for captured Thargoid defence plans. Reach Nerith for collection, then deliver to Veyara. Expect Thargoid opposition while carrying the plans."
destination = "Galaxy 3: Nerith (50.0099,8.1737), then Veyara (63.0828,31.2786). Dock at each destination."
reward = "Naval Energy Unit and 256 combat points on delivery. The unit replaces a standard energy unit."
prerequisites = ["Constrictor Hunt: {constrictor}.", "Combat points: {kills} of 1280 required to receive orders.", "Receive orders in Galaxy 3. Current: {galaxy}."]
milestones = ["Receive orders to report to Nerith", "Dock at Nerith and collect plans", "Dock at Veyara for delivery and reward"]

[[stages]]
id = "not-started"
objective = "Report to Nerith, collect the plans and deliver them to Veyara."
completed = 0
legacyValues = [0, 1, 3, 2]

[[stages]]
id = "ceerdi"
objective = "Report to Nerith, collect the plans and deliver them to Veyara."
completed = 1
legacyValues = [6]
legacyWrite = 6

[[stages]]
id = "carrying"
objective = "Carry the plans to Veyara and dock."
completed = 2
legacyValues = [10]
legacyWrite = 10

[[stages]]
id = "complete"
objective = "Naval missions complete."
completed = 3
legacyValues = [14]
legacyWrite = 14
terminal = true

[[dialogs]]
id = "ceerdiorders"
text = "COMMANDER {commander},\nCAPTAIN {plans_captain}, SPACE NAVY.\n\nWE HAVE ANOTHER ASSIGNMENT FOR YOU. REPORT TO NERITH IN THIS GALAXY FOR YOUR BRIEFING.\n\nMESSAGE ENDS"
ship = false
delaySeconds = 2.0

[[dialogs]]
id = "planscollection"
text = "COMMANDER {commander},\nAGENT {plans_agent}, NAVAL INTELLIGENCE.\n\nWE HAVE OBTAINED DEFENCE PLANS FOR THE THARGOID HIVE WORLDS. THE NAVY IS PREPARING AN OFFENSIVE.\n\nRADIO TRANSMISSION WOULD EXPOSE THE PLANS TO INTERCEPTION. THEY HAVE BEEN ENCODED INTO THIS MESSAGE FOR YOU TO CARRY TO OUR BASE ON VEYARA.\n\nREACH VEYARA IN THIS GALAXY AND DOCK THERE. EXPECT THARGOID OPPOSITION.\n\nMESSAGE ENDS"
ship = false
delaySeconds = 2.0

[[dialogs]]
id = "plansdebriefing"
text = "COMMANDER {commander},\n\nTHE PLANS HAVE REACHED OUR VEYARA BASE. YOUR SERVICE WILL BE REMEMBERED.\n\nWE HAVE FITTED A NAVAL ENERGY UNIT IN RECOGNITION OF YOUR WORK. IT REPLACES A STANDARD ENERGY UNIT AND RECHARGES AT THREE TIMES THE UNUPGRADED RATE.\n\nYOUR COMBAT TALLY HAS INCREASED BY 256 POINTS.\n\nMESSAGE ENDS"
ship = false
delaySeconds = 2.0

[[transitions]]
id = "orders"
from = "not-started"
event = "dock"
to = "ceerdi"
conditions = [{ field = "navalStage", op = "eq", value = 2 }, { field = "kills", op = "ge", value = 1280 }, { field = "galaxy", op = "eq", value = 2 }]
actions = []
dialog = "ceerdiorders"

[[transitions]]
id = "collection"
from = "ceerdi"
event = "dock"
to = "carrying"
conditions = [{ field = "galaxy", op = "eq", value = 2 }, { field = "system", op = "eq", value = 83 }]
actions = []
dialog = "planscollection"

[[transitions]]
id = "delivery"
from = "carrying"
event = "dock"
to = "complete"
conditions = [{ field = "galaxy", op = "eq", value = 2 }, { field = "system", op = "eq", value = 36 }]
actions = [{ kind = "equipmentRemove", key = "Extra Energy Unit" }, { kind = "equipmentAdd", key = "Naval Energy Unit" }, { kind = "killsWrapped", amount = 256 }]
dialog = "plansdebriefing"

[[encounters]]
id = "plans"
stage = "carrying"
kind = "plans-ambush"
