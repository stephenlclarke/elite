briefing = "Avenor authorises measurements of three registered Renas calibration markers. Fit a targeting computer. In front view, hold the next marker within 2 degrees and 250-1500 surface flight units, with clear nearest-hit sight, for 12 continuous native seconds. Pause freezes observation; interruption or load resets unfinished dwell. Completed readings persist. Return all three measurements to actual Avenor reception for 730 CR and the first family clue. Scans alone pay nothing. Zero cargo, berths, deposit and deadline."
destination = "Three registered Renas calibration markers, then actual Avenor reception"
reward = "730 CR after actual measurement reception: L2 H0, untimed, zero deposit."
milestones = ["Accept native survey permission", "Measure calibration-a", "Measure calibration-b", "Measure calibration-c", "Return measurements to actual Avenor reception"]

