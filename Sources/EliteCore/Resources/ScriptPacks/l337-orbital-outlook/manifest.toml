briefing = "SOREL: Lysa Renn and Tovan Hale request the whole Avenor-Renas-Avenor itinerary, including three ordered native viewing markers. Obtain each native reply, then board both into two real free life-supported berths. At Renas, use the existing fitted targeting computer in front view: hold the NEXT marker within 2 degrees at 250-1500 surface flight units with clear nearest-hit sight for 12 continuous native seconds. Pause freezes observation; interruption or load resets only the unfinished view. Completed views persist. Return the same living people to actual Avenor reception for 870 CR and the first family clue. No cargo, deposit or deadline. The third scan alone pays nothing."
destination = "Three ordered Renas orbital views, then actual Avenor return care"
reward = "870 CR after full native return reception: L2 H0, untimed, zero deposit."
milestones = ["Board both consenting original people", "Observe outlook-one", "Observe outlook-two", "Observe outlook-three", "Return both people to actual Avenor care"]

