schemaVersion = 2
missionAPI = 2
id = "l337.wayfarer-service"
version = "1.0.0"
minimumEngine = "2.0.0"
capabilities = ["script-lua-v1", "story-v2", "durable-commands-v2", "owned-equipment-v2"]
priority = 519
source = "Original L337 W02 repair loop. Six finite failed original units; no replenishment."
license = "MIT"
environments = ["space", "orbital-station"]
module = "scripts/main.lua"

[mission]
id = "repair-loop"
title = "Closed repair exchange"
briefing = "Collect an identified failed scoop-control unit from its Cedamar owner. Transport that original serial to the registered Celalen workshop, Confirm native repair, then return the same serviced unit to its original Cedamar owner. The protected transport-only loan uses 2t and no berth. Six finite units never replenish. Ordinary H0 work requires no accreditation. No deposit, workshop fee or deadline applies."
destination = "Celalen workshop, then original Cedamar owner"
reward = "610 CR on original-owner return: 430 CR base + 90 CR per route leg, two legs, H0."
milestones = ["Same original unit serviced at Celalen and returned to Cedamar"]

[repairLoop]
batch = "cedamar-repair-01"
stockUnits = 6
tonnes = 2
maximumActive = 3
route = [85, 241, 85]
hazardTier = 0
rewardNative = 6100

[repairLoop.source]
galaxy = 0
system = 85
resourceKey = "main-orbital:0:85"

[repairLoop.workshop]
galaxy = 0
system = 241
resourceKey = "main-orbital:0:241"

[repairLoop.receiver]
galaxy = 0
system = 85
resourceKey = "main-orbital:0:85"

[[equipment]]
id = "repair-unit"
name = "Fuel Scoops"
quantity = 1
loan = true
returnPolicy = "all"

[[handlers]]
event = "mission.accepted"
function = "accepted"
