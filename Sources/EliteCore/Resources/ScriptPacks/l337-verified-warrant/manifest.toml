schemaVersion = 2
missionAPI = 2
id = "l337.contract"
version = "1.0.0"
minimumEngine = "2.0.0"
capabilities = ["script-lua-v1", "story-v2", "contracts-basic-v2", "local-flight-clocks-v2", "durable-commands-v2", "profiled-encounters-v2", "exclusive-choices-v2", "gallery-basic-v2"]
priority = 560
source = "Original G06 verified warrant. Avenor-Renas-Avenor, two actual quoted legs, H0, 860 + 130*2 = 1120 CR. Unique armed hostile actor and native attributed destruction; Voss receives the report."
license = "MIT"
environments = ["space", "orbital-station"]
module = "scripts/main.lua"

[mission]
id = "verified-warrant"
title = "Verified hostile warrant"
briefing = "VOSS: Accept one specifically identified armed aggressor near Renas. The warrant names an actor, not a hull class. Obtain its actual player-attributed destruction record, then return to Voss at Avenor main orbital. 0t, no berths or deposit, H0, untimed. Unrelated kills and culling never count."
destination = "Renas / return to Voss at Avenor main orbital"
reward = "1120 CR for L2/H0, once after the actual verified report. No failure payment."
milestones = ["Accept the identified warrant", "Destroy the actual hostile yourself", "Report to Voss at Avenor"]
requiredDestructionEncounters = ["verified-hostile"]
requiredChoiceGroups = ["warrant-terminal"]

[board]
id = "verified-warrant"
title = "Verified warrant / L2 H0 / Untimed"
generator = "generate"
clock = "local"
refreshSeconds = 3600
exclusiveGroup = "verified-warrant"

[[dialogs]]
id = "voss-report"
text = "VOSS: Confirm the exact armed aggressor's player-attributed destruction record. The advertised 1120 CR and this family's first-success clue commit together. Back changes nothing."
choices = [{id="report-verified-target", label="Report the verified target", group="warrant-terminal"}]

[[dialogs]]
id = "voss-withdraw"
text = "VOSS: Withdraw this warrant for zero payment. This does not restore a destroyed actor. A later warrant requires a new native offer and instance. Back changes nothing."
choices = [{id="withdraw-warrant", label="Withdraw this warrant", group="warrant-terminal"}]

[[handlers]]
event = "mission.accepted"
function = "accepted"
[[handlers]]
event = "system.entered"
function = "deploy"
[[handlers]]
event = "station.undocked"
function = "deploy"
[[handlers]]
event = "encounter.admitted"
function = "admitted"
[[handlers]]
event = "actor.destroyed"
function = "destroyed"
[[handlers]]
event = "contact.requested"
function = "contact"
[[handlers]]
event = "dialogue.confirmed"
function = "confirm"

