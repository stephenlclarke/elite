schemaVersion = 2
missionAPI = 2
id = "l337.contract"
version = "1.0.0"
minimumEngine = "2.0.0"
capabilities = ["script-lua-v1", "story-v2", "durable-commands-v2", "contracts-basic-v2", "local-flight-clocks-v2", "partial-collections-v2", "mission-calendar-v2", "freight-contracts-basic-v2", "dialogue-choices-v2", "gallery-basic-v2"]
priority = 566
source = "Original G02: finite sixteen-tonne Machinery utility-parts batch; eight original tonnes per job, ARLEN at Avenor to the consenting Renas utility receiving crew. Reward 620 + 110L + 80H CR, H0, no deposit, untimed."
license = "MIT"
environments = ["space", "orbital-station"]
module = "scripts/main.lua"

[mission]
id = "consented-freight"
title = "Consented freight supply"
briefing = "ARLEN: Reserve eight original tonnes from the real sixteen-tonne utility-parts batch at Avenor. Deliver the same units to the consenting utility receiving crew at Renas. 0 berths, no deposit, H0, untimed. Losses and abandonment never replenish stock; ordinary Machinery cannot replace these units."
destination = "Renas main orbital / utility receiving crew"
reward = "620 CR + 110 CR per actual native route leg, H0; no deposit or deadline."
milestones = ["Deliver all eight original utility-parts tonnes to the consenting receiving crew"]
requiredCollections = ["freight-goods"]

[board]
id = "consented-freight"
title = "ARLEN / Consented freight supply"
generator = "generate"
clock = "missionCalendar"
refreshSeconds = 3600
exclusiveGroup = "g03-freight"

[freight]
profile = "l337.contract/consented-freight"
generatorRevision = 1
variant = "supplied"
deliveryContact = "freight-delivery"
abandonContact = "freight-abandon"

[freight.supply]
batch = "avenor-utility-parts-01"
stockUnits = 16
commodity = 8
issuerContact = "arlen"
galaxy = 0
system = 7
receiverSystem = 185

[freight.collectionTemplate]
id = "freight-goods"
title = "Eight original utility-parts tonnes"

[[dialogs]]
id = "freight-delivery"
text = "Renas utility receiving crew: we consent to receive these same identified utility parts. Confirm one original tonne or all remaining units. Seven tonnes do not settle the job; the eighth commits the frozen payment and first family clue. Back transfers nothing."
collection = "freight-goods"

[[dialogs.choices]]
id = "freight-one"
label = "Receive one original tonne"

[[dialogs.choices]]
id = "freight-all"
label = "Receive all remaining original tonnes"

[[dialogs]]
id = "freight-abandon"
text = "ARLEN: Confirm abandonment for zero payment. These allocated original units never return to available supplier stock. Neither a quote nor a lost crate creates replacement stock. Back changes nothing."

[[handlers]]
event = "mission.accepted"
function = "accepted"
[[handlers]]
event = "contact.requested"
function = "contact"

[trial]
ship = "SH025"
galaxy = 0
system = 7
credits = 100000
cabins = 0
flight = true
offer = 0
