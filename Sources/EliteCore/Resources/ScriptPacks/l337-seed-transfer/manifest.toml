[mission]
id = "seed-transfer"
title = "Seed-bank transfer"
briefing = "Collect one original three-tonne seed consignment released by Custodian Lysa Verin at Celalen main orbital station. Carry the same lot to Cedamar, Confirm actual arrival, then Confirm acceptance by the distinct receiving seed-bank Custodian Oren Hale. The explicitly authored integrity allowance is 2700 armed-flight seconds after pickup; pause stops the clock and current load preserves its remaining budget. This is institutional seed custody, not a passenger journey. Six finite lots never replenish. Ordinary H0 work requires three actual free cargo tonnes, no berth or accreditation."
destination = "Custodian Oren Hale, Cedamar main orbital station, G01-S085"
reward = "605 CR at actual receiving acceptance: 510 CR base + 95 CR for one leg + 0 CR hazard premium."
milestones = ["Original seed lot received by Cedamar custodian"]

