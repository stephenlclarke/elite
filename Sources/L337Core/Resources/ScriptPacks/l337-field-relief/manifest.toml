[mission]
id = "field-relief"
title = "Remote utility relief"
briefing = "Collect four original one-tonne repair materials at Avenor's actual main station. Carry those same originals to the actual RRS headquarters in galaxy 1/system 237, Confirm regulator installation, then separately Confirm the current resident engineer's inspection. Installation alone pays nothing. The frozen quote is 610 CR plus 110 CR per reachable route leg, ordinary hazard tier 0, no deadline, deposit or passenger berth. Later route legs assume refuelling. Two finite original batches never replenish; lost or returned materials cannot be replaced. Successful reception pays once and retains this family's field relief trace."
destination = "Actual RRS headquarters, galaxy 1/system 237"
reward = "610 CR + 110 CR per full quoted reachable route leg; H0, untimed, once per original batch."
milestones = ["Collect original repair materials", "Install the same originals", "Current engineer reception and once-only payment"]

[fieldRelief]
