[mission]
id = "custody-rescue"
title = "Consented custody rescue"
briefing = "DAIN: Neri Voss and Ilan Rook are the two registered living capsule occupants outside Cedamar. Reserve two working compatible cabins and one real cargo tonne. Rescue one original capsule through the fitted rescue tools, return to actual Cedamar care, then repeat for the other. Care frees that same pod tonne; it is not transport consent. Request both native replies for Celalen and separately board those same people. Recover their original physical emergency record last. Receive both people and record at actual Celalen for 1020 CR and the first family clue. Empty, dead, unrelated or EMP capsules cannot substitute. Untimed, L1 H0, zero deposit; intermediate care pays nothing."
destination = "Serial Cedamar rescue care, then actual Celalen people-plus-record reception"
reward = "1020 CR at complete actual reception; two cabins, one protected tonne, L1 H0, no deadline or deposit"
milestones = ["Accept the finite original rescue incident", "Receive both consenting originals and their record at Celalen"]

