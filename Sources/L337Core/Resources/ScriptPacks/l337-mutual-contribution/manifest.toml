license = "MIT"
environments = ["orbital-station"]
module = "scripts/main.lua"

[mission]
id = "mutual-contribution"
title = "Mutual relief contribution"
briefing = "Voluntarily contribute exactly 500 CR to the Cedamar Orbital Relief Reserve at Cedamar main orbital station. Read the named recipient and deliberate Donate action. Back transfers nothing; Decline consumes this offer without a contribution. No cargo, passenger berth, deposit, cash reward, deadline, refund or privilege applies. Later hourly offers permit another full voluntary donation. The first verified completed contribution preserves this family's distinct journal clue once."
destination = "Cedamar Orbital Relief Reserve, Cedamar main orbital station, G01-S085"
reward = "No cash reward, refund or privilege; actual reserve acknowledgement and first-success family clue."
milestones = ["Actual relief reserve contribution received"]

[board]
id = "mutual-relief"
title = "Cedamar Orbital Relief Reserve / voluntary contribution"
generator = "generate"
clock = "local"
refreshSeconds = 3600
exclusiveGroup = "mutual-relief"

[pledge]
profile = "original-mutual-contribution"
provider = "l337.contract"
title = "Cedamar Orbital Relief Reserve"
creditAmounts = [5000]
foodTonnes = []

[[handlers]]
event = "mission.accepted"
function = "accepted"
