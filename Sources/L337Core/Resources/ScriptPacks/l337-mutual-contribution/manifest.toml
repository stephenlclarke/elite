schemaVersion = 2
missionAPI = 2
id = "l337.contract"
version = "1.0.0"
minimumEngine = "2.0.0"
capabilities = ["script-lua-v1", "story-v2", "local-flight-clocks-v2", "contracts-basic-v2", "station-pledges-basic-v2", "durable-commands-v2"]
