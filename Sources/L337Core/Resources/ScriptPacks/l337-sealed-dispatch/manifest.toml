schemaVersion = 2
missionAPI = 2
id = "l337.contract"
version = "1.0.0"
minimumEngine = "2.0.0"
capabilities = ["script-lua-v1", "story-v2", "local-flight-clocks-v2", "contracts-basic-v2", "courier-contracts-basic-v2", "mission-calendar-v2", "durable-commands-v2", "gallery-basic-v2"]
priority = 560
source = "Original G01 sealed dispatch: one-tonne record, H0, 320 + 90 * quoted legs CR, untimed. Native route generation and unique courier custody."
license = "MIT"
environments = ["space", "orbital-station"]
module = "scripts/main.lua"

[mission]
id = "sealed-dispatch"
title = "Sealed dispatch"
briefing = "Carry one uniquely identified sealed record from this station to its quoted receiving officer. Reserves 1t of real hold and no passenger berths. H0; no deposit, deadline or failure payment. Back changes nothing."
destination = "Quoted destination main orbital / Sealed Dispatch Receiving Officer"
reward = "320 + 90 per quoted leg CR, once on actual handoff."
milestones = ["Collect original sealed record", "Confirm receiving officer handoff"]

[board]
id = "sealed-dispatch"
title = "Sealed dispatch / H0 / Untimed"
generator = "generate"
clock = "missionCalendar"
refreshSeconds = 3600
exclusiveGroup = "sealed-dispatch"

[courier]
profile = "original-sealed-dispatch"
generatorRevision = 1
deliveryContact = "sealed-dispatch-receiver"
abandonContact = "sealed-dispatch-sender"

[[dialogs]]
id = "sealed-dispatch-receiver"
text = "Sealed Dispatch Receiving Officer: confirm receipt of this original held record for its frozen reward. Back changes nothing."

[[dialogs]]
id = "sealed-dispatch-sender"
text = "Sealed Dispatch Officer: confirm abandonment, consume this consignment and receive 0 CR. Back changes nothing."

[[handlers]]
event = "mission.accepted"
function = "accepted"
[[handlers]]
event = "contact.requested"
function = "contact"
[[handlers]]
event = "dialogue.confirmed"
function = "confirm"

[trial]
ship = "SH025"
galaxy = 0
system = 7
credits = 100000
cabins = 0
flight = false
offer = 0
