[mission]
id = "identified-salvage"
title = "PELL identified salvage return"
briefing = "PELL: The Avenor recovery depot authorises retrieval of its two detached packed equipment units at the Renas wreck cradle. PELL-01 is the sealed utility controller; PELL-02 is the sealed power regulator. Each is one tonne of protected owner property, not a ship upgrade or market commodity. Fit targeting, the Salvage targeting module and Fuel Scoops. Reserve two real hold tonnes; pickup fills each reserved slot without adding another tonne. Select and approach the actual packages using ordinary salvage recovery. Return BOTH originals to this same Avenor depot for 880 CR and the family clue. A lost item prevents success; return a surviving held mate without payment. Zero cabins, deposit or deadline."
destination = "Renas exterior wreck cradle, then the actual Avenor recovery depot"
reward = "880 CR at both-original owner reception; L2 H0, untimed, zero deposit."
milestones = ["Accept depot retrieval permission", "Recover PELL-01", "Recover PELL-02", "Return both originals to their actual owner"]

