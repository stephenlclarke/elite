[mission]
id = "record-recovery"
title = "SENN crew record recovery"
briefing = "SENN: Retrieve the archive-owned CDR-001 flight/custody recorder from the Celalen exterior cradle. One protected tonne, zero berths, deposit or deadline. Fit actual targeting, Salvage targeting and Fuel Scoops. First identify the selected original in front view, within 2 degrees and 250-1500 surface units with clear nearest-hit sight across one positive native frame. Identification leaves it at the cradle. Only a separately later safe scoop pickup transfers custody. Return that same original to this actual Cedamar archive for 650 CR and the record-recovery clue. The recorder is not living crew, ordinary cargo or an upgrade; loss cannot be replaced."
destination = "Celalen exterior wreck cradle, then the actual Cedamar recovery depot"
reward = "650 CR at actual custodian reception; L2 H0, untimed, zero deposit."
milestones = ["Accept archive retrieval permission", "Identify original CDR-001", "Recover the identified original", "Return the original to its actual custodian"]

