# DESIGN EXAMPLE ONLY: proposed schema2; unsupported by the current game.
# Demonstrates two handlers, not the complete Maenes encounter/content pack.
schemaVersion = 2
id = "research.iron-raven-example"
version = "0.1.0"
missionAPI = 2
minimumEngine = "2.0.0"
language = "lua-5.5.1"
sourceProfile = "P19-MAENES-v1"
capabilities = ["script-lua-v1", "combat-events-v1", "world-clocks-v1", "custody-v1", "campaigns-v1"]
environments = ["space", "orbital-station"]
source = "Iron Raven2.0.2 selected source/project specification"
license = "Design example; original source/art rights remain separate"

[mission]
id = "maenes-example"
title = "Maenes orbital defence example"
instanceType = "campaign-child"
parentReceipt = "iron-raven.loa.intercept-confirmed"
script = "main"
initialData = { phase = "battle", finalTimerRequested = false }
milestones = ["arrival", "deployment", "transports", "flagship", "report"]

[modules]
main = "scriptable-maenes.lua"

[[subscriptions]]
events = ["body.destroyed", "timer.fired", "dialogue.confirmed"]
handler = "main.on_event"
ownedEncounter = "battle"

[[objectives]]
id = "transports"
kind = "owned-hulls-destroyed"
encounter = "battle"
cohort = "transports"
requiredAdmittedCount = 8
attacker = "any"

[[objectives]]
id = "flagship"
kind = "owned-hulls-destroyed"
encounter = "battle"
cohort = "flagship"
requiredAdmittedCount = 1
attacker = "any"

[clocks.battlePulse]
domain = "local-world"
owner = "battle"
policy = "source-pulse-counter"
firstDelay = 0
interval = 1
missedIntervals = "skip"

[[timers]]
id = "final-sequence"
clock = "battlePulse"
reset = "next-fired-pulse"
fireAfterFollowingPulses = 10
handler = "main.on_event"
requiresObjectives = ["transports", "flagship"]

[[dialogs]]
id = "report"
textKey = "IR_LOA_6"
stationBinding = "maenes-main-orbital"
requiresObjectives = ["transports", "flagship"]
requiresNativeFacts = ["party.docked", "battle.final-sequence-fired"]
confirmation = true

[[calendarAnchors]]
id = "epilogue"
clock = "commander-calendar"
offsetDays = 10
comparison = "strict-greater"

[gallery]
title = "Iron Raven: Maenes orbital defence"
scenarios = ["flagship-first", "flagship-last", "report-back", "failed-care"]
isolated = true
