<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">The Shared Pulse</title><desc id="desc">Bounded acknowledgement and feedback cutoff Set the two real reply cutoffs and follow three live cycles with exactly one reply each and the full quiet window.</desc>
<rect width="1600" height="900" fill="#0b111b"/>
<rect x="35" y="30" width="1530" height="840" rx="22" fill="#101b2b" stroke="#365064"/>
<g transform="translate(0,35)"><rect x="170" y="260" width="240" height="70" rx="14" fill="#101b2b" stroke="#75c6e9" stroke-width="2"/><text x="290.0" y="302.0" font-family="Arial, sans-serif" font-size="21" fill="#75c6e9" text-anchor="middle">A: one reply</text><rect x="430" y="260" width="240" height="70" rx="14" fill="#101b2b" stroke="#a3e6c2" stroke-width="2"/><text x="550.0" y="302.0" font-family="Arial, sans-serif" font-size="21" fill="#a3e6c2" text-anchor="middle">B: one reply</text><rect x="690" y="260" width="290" height="70" rx="14" fill="#101b2b" stroke="#d5bb72" stroke-width="2"/><text x="835.0" y="302.0" font-family="Arial, sans-serif" font-size="21" fill="#d5bb72" text-anchor="middle">Quiet 4 s</text><rect x="170" y="370" width="240" height="70" rx="14" fill="#101b2b" stroke="#75c6e9" stroke-width="2"/><text x="290.0" y="412.0" font-family="Arial, sans-serif" font-size="21" fill="#75c6e9" text-anchor="middle">A: one reply</text><rect x="430" y="370" width="240" height="70" rx="14" fill="#101b2b" stroke="#a3e6c2" stroke-width="2"/><text x="550.0" y="412.0" font-family="Arial, sans-serif" font-size="21" fill="#a3e6c2" text-anchor="middle">B: one reply</text><rect x="690" y="370" width="290" height="70" rx="14" fill="#101b2b" stroke="#d5bb72" stroke-width="2"/><text x="835.0" y="412.0" font-family="Arial, sans-serif" font-size="21" fill="#d5bb72" text-anchor="middle">Quiet 4 s</text><rect x="170" y="480" width="240" height="70" rx="14" fill="#101b2b" stroke="#75c6e9" stroke-width="2"/><text x="290.0" y="522.0" font-family="Arial, sans-serif" font-size="21" fill="#75c6e9" text-anchor="middle">A: one reply</text><rect x="430" y="480" width="240" height="70" rx="14" fill="#101b2b" stroke="#a3e6c2" stroke-width="2"/><text x="550.0" y="522.0" font-family="Arial, sans-serif" font-size="21" fill="#a3e6c2" text-anchor="middle">B: one reply</text><rect x="690" y="480" width="290" height="70" rx="14" fill="#101b2b" stroke="#d5bb72" stroke-width="2"/><text x="835.0" y="522.0" font-family="Arial, sans-serif" font-size="21" fill="#d5bb72" text-anchor="middle">Quiet 4 s</text><text x="580" y="210" font-family="Arial, sans-serif" font-size="24" fill="#dce7ef" text-anchor="middle">Three 10-second cycles; no recursive replies</text></g>
<text x="75" y="80" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">MERIDIAN / OPERATION BRIEF</text><text x="75" y="130" font-family="Arial, sans-serif" font-size="34" fill="#dce7ef" text-anchor="start">The Shared Pulse</text><text x="75" y="173" font-family="Arial, sans-serif" font-size="20" fill="#94a6b8" text-anchor="start">Bounded acknowledgement and feedback cutoff</text><path d="M75,195 L1525,195" fill="none" stroke="#365064" stroke-width="3"/><rect x="1130" y="225" width="395" height="430" rx="14" fill="#101b2b" stroke="#365064" stroke-width="2"/><text x="1160" y="260" font-family="Arial, sans-serif" font-size="19" fill="#d5bb72" text-anchor="start">TARGETS</text><text x="1160" y="300" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Cycle s: 10</text><text x="1160" y="333" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Reply Budget Per Side: 1</text><text x="1160" y="366" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Quiet s: 4</text><text x="1160" y="399" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Test Cycles: 3</text><path d="M75,680 L1525,680" fill="none" stroke="#365064" stroke-width="3"/><text x="75" y="725" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">WHAT YOU DO</text><text x="75" y="765" font-family="Arial, sans-serif" font-size="23" fill="#dce7ef" text-anchor="start">Set the two real reply cutoffs and follow three live cycles with exactly one reply each and the full quiet window.</text><text x="75" y="850" font-family="Arial, sans-serif" font-size="17" fill="#94a6b8" text-anchor="start">Schematic briefing illustration. Not to scale; not a game capture. Values are test targets, not earned success.</text>
</svg>
