<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">False Colours</title><desc id="desc">Identity-key revocation and reissue Challenge each actual transmitter with new nonces, revoke the retired key and replay its signed old packet to prove rejection.</desc>
<rect width="1600" height="900" fill="#0b111b"/>
<rect x="35" y="30" width="1530" height="840" rx="22" fill="#101b2b" stroke="#365064"/>
<g transform="translate(0,35)"><rect x="160" y="230" width="260" height="85" rx="14" fill="#101b2b" stroke="#a3e6c2" stroke-width="2"/><text x="290.0" y="279.5" font-family="Arial, sans-serif" font-size="21" fill="#a3e6c2" text-anchor="middle">Identity A / new nonce</text><rect x="160" y="420" width="260" height="85" rx="14" fill="#101b2b" stroke="#75c6e9" stroke-width="2"/><text x="290.0" y="469.5" font-family="Arial, sans-serif" font-size="21" fill="#75c6e9" text-anchor="middle">Identity B / new nonce</text><rect x="760" y="310" width="250" height="95" rx="14" fill="#101b2b" stroke="#a3e6c2" stroke-width="2"/><text x="885.0" y="364.5" font-family="Arial, sans-serif" font-size="21" fill="#a3e6c2" text-anchor="middle">Verifier</text><path d="M435,270 L745,345" fill="none" stroke="#a3e6c2" stroke-width="3"/><polygon points="745,345 733.4114605906141,348.1154059698712 736.117161705921,336.9318413599357" fill="#a3e6c2"/><path d="M435,460 L745,375" fill="none" stroke="#75c6e9" stroke-width="3"/><polygon points="745,375 736.3651839676875,383.3330637875945 733.3225575951802,372.23642642903854" fill="#75c6e9"/><path d="M550,530 L725,415" fill="none" stroke="#d5bb72" stroke-width="3" stroke-dasharray="8 8"/><polygon points="725,415 719.3586721788779,425.5912898371555 713.0397144804325,415.9754846438691" fill="#d5bb72"/><circle cx="565" cy="510" r="35" fill="#101b2b" stroke="#df8d73" stroke-width="3"/><path d="M547,492 L583,528" fill="none" stroke="#df8d73" stroke-width="4"/><path d="M583,492 L547,528" fill="none" stroke="#df8d73" stroke-width="4"/><text x="565" y="575" font-family="Arial, sans-serif" font-size="18" fill="#df8d73" text-anchor="middle">RETIRED KEY REPLAY</text><text x="560" y="210" font-family="Arial, sans-serif" font-size="22" fill="#dce7ef" text-anchor="middle">Identity and signed challenge; colour is insufficient</text></g>
<text x="75" y="80" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">MERIDIAN / OPERATION BRIEF</text><text x="75" y="130" font-family="Arial, sans-serif" font-size="34" fill="#dce7ef" text-anchor="start">False Colours</text><text x="75" y="173" font-family="Arial, sans-serif" font-size="20" fill="#94a6b8" text-anchor="start">Identity-key revocation and reissue</text><path d="M75,195 L1525,195" fill="none" stroke="#365064" stroke-width="3"/><rect x="1130" y="225" width="395" height="430" rx="14" fill="#101b2b" stroke="#365064" stroke-width="2"/><text x="1160" y="260" font-family="Arial, sans-serif" font-size="19" fill="#d5bb72" text-anchor="start">TARGETS</text><text x="1160" y="300" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Distinct Test Identities: 2</text><text x="1160" y="333" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Duplicate Keys Allowed: 0</text><text x="1160" y="366" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Test s: 12</text><path d="M75,680 L1525,680" fill="none" stroke="#365064" stroke-width="3"/><text x="75" y="725" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">WHAT YOU DO</text><text x="75" y="765" font-family="Arial, sans-serif" font-size="23" fill="#dce7ef" text-anchor="start">Challenge each actual transmitter with new nonces, revoke the retired key and replay its signed old packet to prove</text><text x="75" y="794" font-family="Arial, sans-serif" font-size="23" fill="#dce7ef" text-anchor="start">rejection.</text><text x="75" y="850" font-family="Arial, sans-serif" font-size="17" fill="#94a6b8" text-anchor="start">Schematic briefing illustration. Not to scale; not a game capture. Values are test targets, not earned success.</text>
</svg>
