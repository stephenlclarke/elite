<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Continuity inquiry</title><desc id="desc">Measure source trace Fly to three registered non-consumable external reference beacons in the current ordinary system; perform source-specific measurements and reconcile them with the independent archived observations.</desc>
<rect width="1600" height="900" fill="#0b111b"/>
<rect x="35" y="30" width="1530" height="840" rx="22" fill="#101b2b" stroke="#365064"/>
<g transform="translate(0,35)"><circle cx="240" cy="340" r="55" fill="#101b2b" stroke="#a3e6c2" stroke-width="3"/><text x="240" y="347" font-family="Arial, sans-serif" font-size="21" fill="#a3e6c2" text-anchor="middle">1</text><circle cx="580" cy="260" r="55" fill="#101b2b" stroke="#a3e6c2" stroke-width="3"/><text x="580" y="267" font-family="Arial, sans-serif" font-size="21" fill="#a3e6c2" text-anchor="middle">2</text><circle cx="900" cy="425" r="55" fill="#101b2b" stroke="#a3e6c2" stroke-width="3"/><text x="900" y="432" font-family="Arial, sans-serif" font-size="21" fill="#a3e6c2" text-anchor="middle">3</text><path d="M300,330 L510,280" fill="none" stroke="#75c6e9" stroke-width="3"/><polygon points="510,280 501.08792431138835,288.03585135007216 498.42284920605664,276.842535907679" fill="#75c6e9"/><path d="M635,285 L840,395" fill="none" stroke="#75c6e9" stroke-width="3"/><polygon points="840,395 828.0003387806931,395.09016996097614 833.4406799677093,384.95135229426415" fill="#75c6e9"/><text x="570" y="555" font-family="Arial, sans-serif" font-size="24" fill="#dce7ef" text-anchor="middle">Three actual case-linked reference measurements</text><text x="570" y="610" font-family="Arial, sans-serif" font-size="20" fill="#94a6b8" text-anchor="middle">Archived observations are independent; old scans do not qualify.</text></g>
<text x="75" y="80" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">MERIDIAN / OPERATION BRIEF</text><text x="75" y="130" font-family="Arial, sans-serif" font-size="34" fill="#dce7ef" text-anchor="start">Continuity inquiry</text><text x="75" y="173" font-family="Arial, sans-serif" font-size="20" fill="#94a6b8" text-anchor="start">Measure source trace</text><path d="M75,195 L1525,195" fill="none" stroke="#365064" stroke-width="3"/><rect x="1130" y="225" width="395" height="430" rx="14" fill="#101b2b" stroke="#365064" stroke-width="2"/><text x="1160" y="260" font-family="Arial, sans-serif" font-size="19" fill="#d5bb72" text-anchor="start">TARGETS</text><text x="1160" y="300" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Required Source Count: 64</text><text x="1160" y="333" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Case Stages: 5</text><text x="1160" y="366" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Commander Charge CR: 0</text><path d="M75,680 L1525,680" fill="none" stroke="#365064" stroke-width="3"/><text x="75" y="725" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">WHAT YOU DO</text><text x="75" y="765" font-family="Arial, sans-serif" font-size="23" fill="#dce7ef" text-anchor="start">Fly to three registered non-consumable external reference beacons in the current ordinary system; perform source-</text><text x="75" y="794" font-family="Arial, sans-serif" font-size="23" fill="#dce7ef" text-anchor="start">specific measurements and reconcile them with the independent archived observations.</text><text x="75" y="850" font-family="Arial, sans-serif" font-size="17" fill="#94a6b8" text-anchor="start">Schematic briefing illustration. Not to scale; not a game capture. Values are test targets, not earned success.</text>
</svg>
