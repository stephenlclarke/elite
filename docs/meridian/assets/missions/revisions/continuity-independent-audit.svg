<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Continuity inquiry</title><desc id="desc">Independent audit Bring the signed measured results to a different authorised desk operator. Reconcile at least two independently corroborated records and explicitly record the original loss/outcome.</desc>
<rect width="1600" height="900" fill="#0b111b"/>
<rect x="35" y="30" width="1530" height="840" rx="22" fill="#101b2b" stroke="#365064"/>
<g transform="translate(0,35)"><rect x="150" y="260" width="260" height="160" rx="14" fill="#101b2b" stroke="#75c6e9" stroke-width="2"/><text x="280.0" y="347.0" font-family="Arial, sans-serif" font-size="21" fill="#75c6e9" text-anchor="middle">New measurements</text><rect x="740" y="260" width="280" height="160" rx="14" fill="#101b2b" stroke="#a3e6c2" stroke-width="2"/><text x="880.0" y="347.0" font-family="Arial, sans-serif" font-size="21" fill="#a3e6c2" text-anchor="middle">Independent receiver</text><path d="M425,340 L725,340" fill="none" stroke="#75c6e9" stroke-width="3"/><polygon points="725,340 714.4690092573155,345.75310646325045 714.4690092573155,334.24689353674955" fill="#75c6e9"/><rect x="370" y="510" width="440" height="75" rx="14" fill="#101b2b" stroke="#d5bb72" stroke-width="2"/><text x="590.0" y="554.5" font-family="Arial, sans-serif" font-size="21" fill="#d5bb72" text-anchor="middle">Two corroborated archive records</text></g>
<text x="75" y="80" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">MERIDIAN / OPERATION BRIEF</text><text x="75" y="130" font-family="Arial, sans-serif" font-size="34" fill="#dce7ef" text-anchor="start">Continuity inquiry</text><text x="75" y="173" font-family="Arial, sans-serif" font-size="20" fill="#94a6b8" text-anchor="start">Independent audit</text><path d="M75,195 L1525,195" fill="none" stroke="#365064" stroke-width="3"/><rect x="1130" y="225" width="395" height="430" rx="14" fill="#101b2b" stroke="#365064" stroke-width="2"/><text x="1160" y="260" font-family="Arial, sans-serif" font-size="19" fill="#d5bb72" text-anchor="start">TARGETS</text><text x="1160" y="300" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Required Source Count: 64</text><text x="1160" y="333" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Case Stages: 5</text><text x="1160" y="366" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Commander Charge CR: 0</text><path d="M75,680 L1525,680" fill="none" stroke="#365064" stroke-width="3"/><text x="75" y="725" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">WHAT YOU DO</text><text x="75" y="765" font-family="Arial, sans-serif" font-size="23" fill="#dce7ef" text-anchor="start">Bring the signed measured results to a different authorised desk operator. Reconcile at least two independently</text><text x="75" y="794" font-family="Arial, sans-serif" font-size="23" fill="#dce7ef" text-anchor="start">corroborated records and explicitly record the original loss/outcome.</text><text x="75" y="850" font-family="Arial, sans-serif" font-size="17" fill="#94a6b8" text-anchor="start">Schematic briefing illustration. Not to scale; not a game capture. Values are test targets, not earned success.</text>
</svg>
