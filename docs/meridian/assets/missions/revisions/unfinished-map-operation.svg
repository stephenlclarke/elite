<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">The Unfinished Map</title><desc id="desc">Uncertainty envelope surveying Take two separated measurement baselines at three actual landmarks and compare the resulting uncertainty envelope.</desc>
<rect width="1600" height="900" fill="#0b111b"/>
<rect x="35" y="30" width="1530" height="840" rx="22" fill="#101b2b" stroke="#365064"/>
<g transform="translate(0,35)"><circle cx="270" cy="260" r="40" fill="#101b2b" stroke="#d5bb72" stroke-width="3"/><text x="270" y="267" font-family="Arial, sans-serif" font-size="21" fill="#d5bb72" text-anchor="middle">A</text><circle cx="880" cy="260" r="40" fill="#101b2b" stroke="#d5bb72" stroke-width="3"/><text x="880" y="267" font-family="Arial, sans-serif" font-size="21" fill="#d5bb72" text-anchor="middle">B</text><circle cx="570" cy="500" r="40" fill="#101b2b" stroke="#d5bb72" stroke-width="3"/><text x="570" y="507" font-family="Arial, sans-serif" font-size="21" fill="#d5bb72" text-anchor="middle">C</text><path d="M270,260 L570,500" fill="none" stroke="#75c6e9" stroke-width="3" stroke-dasharray="8 8"/><path d="M880,260 L570,500" fill="none" stroke="#75c6e9" stroke-width="3" stroke-dasharray="8 8"/><path d="M270,260 L880,260" fill="none" stroke="#75c6e9" stroke-width="3" stroke-dasharray="8 8"/><circle cx="520" cy="360" r="20" fill="#101b2b" stroke="#a3e6c2" stroke-width="3"/><circle cx="610" cy="380" r="20" fill="#101b2b" stroke="#a3e6c2" stroke-width="3"/><text x="570" y="575" font-family="Arial, sans-serif" font-size="21" fill="#dce7ef" text-anchor="middle">Two separated baselines / three landmarks / error&lt;=25 m</text></g>
<text x="75" y="80" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">MERIDIAN / OPERATION BRIEF</text><text x="75" y="130" font-family="Arial, sans-serif" font-size="34" fill="#dce7ef" text-anchor="start">The Unfinished Map</text><text x="75" y="173" font-family="Arial, sans-serif" font-size="20" fill="#94a6b8" text-anchor="start">Uncertainty envelope surveying</text><path d="M75,195 L1525,195" fill="none" stroke="#365064" stroke-width="3"/><rect x="1130" y="225" width="395" height="430" rx="14" fill="#101b2b" stroke="#365064" stroke-width="2"/><text x="1160" y="260" font-family="Arial, sans-serif" font-size="19" fill="#d5bb72" text-anchor="start">TARGETS</text><text x="1160" y="300" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Landmarks: 3</text><text x="1160" y="333" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Boundary Tests: 2</text><text x="1160" y="366" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Maximum Declared Error m: 25</text><text x="1160" y="399" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Dwell s: 15</text><path d="M75,680 L1525,680" fill="none" stroke="#365064" stroke-width="3"/><text x="75" y="725" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">WHAT YOU DO</text><text x="75" y="765" font-family="Arial, sans-serif" font-size="23" fill="#dce7ef" text-anchor="start">Take two separated measurement baselines at three actual landmarks and compare the resulting uncertainty envelope.</text><text x="75" y="850" font-family="Arial, sans-serif" font-size="17" fill="#94a6b8" text-anchor="start">Schematic briefing illustration. Not to scale; not a game capture. Values are test targets, not earned success.</text>
</svg>
