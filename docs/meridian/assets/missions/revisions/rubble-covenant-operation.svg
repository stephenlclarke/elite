<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">The Rubble Covenant</title><desc id="desc">Mass and drift-vector clearance Assign actual source-owned tug thrust to three registered fragments; measure their drift and clear the shared corridor while conserving mass and momentum.</desc>
<rect width="1600" height="900" fill="#0b111b"/>
<rect x="35" y="30" width="1530" height="840" rx="22" fill="#101b2b" stroke="#365064"/>
<g transform="translate(0,35)"><circle cx="260" cy="300" r="40" fill="#101b2b" stroke="#d5bb72" stroke-width="3"/><text x="260" y="307" font-family="Arial, sans-serif" font-size="21" fill="#d5bb72" text-anchor="middle">1000 kg</text><path d="M220,400 L245,350" fill="none" stroke="#a3e6c2" stroke-width="3"/><polygon points="245,350 245.43613261923585,361.99207189514965 235.14466291233876,356.84633704170113" fill="#a3e6c2"/><rect x="185" y="410" width="130" height="55" rx="14" fill="#101b2b" stroke="#a3e6c2" stroke-width="2"/><text x="250.0" y="444.5" font-family="Arial, sans-serif" font-size="21" fill="#a3e6c2" text-anchor="middle">TUG</text><circle cx="560" cy="430" r="50" fill="#101b2b" stroke="#d5bb72" stroke-width="3"/><text x="560" y="437" font-family="Arial, sans-serif" font-size="21" fill="#d5bb72" text-anchor="middle">1500 kg</text><path d="M510,530 L545,490" fill="none" stroke="#a3e6c2" stroke-width="3"/><polygon points="545,490 542.3949479169313,501.71382532072676 533.7356402241118,494.13693108950963" fill="#a3e6c2"/><rect x="475" y="540" width="130" height="55" rx="14" fill="#101b2b" stroke="#a3e6c2" stroke-width="2"/><text x="540.0" y="574.5" font-family="Arial, sans-serif" font-size="21" fill="#a3e6c2" text-anchor="middle">TUG</text><circle cx="835" cy="270" r="65" fill="#101b2b" stroke="#d5bb72" stroke-width="3"/><text x="835" y="277" font-family="Arial, sans-serif" font-size="21" fill="#d5bb72" text-anchor="middle">2500 kg</text><path d="M770,370 L820,345" fill="none" stroke="#a3e6c2" stroke-width="3"/><polygon points="820,345 813.1536629582989,354.85533708766127 808.0079281048503,344.5638673807641" fill="#a3e6c2"/><rect x="735" y="380" width="130" height="55" rx="14" fill="#101b2b" stroke="#a3e6c2" stroke-width="2"/><text x="800.0" y="414.5" font-family="Arial, sans-serif" font-size="21" fill="#a3e6c2" text-anchor="middle">TUG</text><path d="M130,205 L1030,205" fill="none" stroke="#75c6e9" stroke-width="3" stroke-dasharray="8 8"/><text x="155" y="185" font-family="Arial, sans-serif" font-size="21" fill="#dce7ef" text-anchor="start">Keep the real corridor clear by at least 500 m</text><text x="190" y="590" font-family="Arial, sans-serif" font-size="20" fill="#dce7ef" text-anchor="start">Total mass 5000 kg / tolerance 0.001 kg / actual drift and thrust</text></g>
<text x="75" y="80" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">MERIDIAN / OPERATION BRIEF</text><text x="75" y="130" font-family="Arial, sans-serif" font-size="34" fill="#dce7ef" text-anchor="start">The Rubble Covenant</text><text x="75" y="173" font-family="Arial, sans-serif" font-size="20" fill="#94a6b8" text-anchor="start">Mass and drift-vector clearance</text><path d="M75,195 L1525,195" fill="none" stroke="#365064" stroke-width="3"/><rect x="1130" y="225" width="395" height="430" rx="14" fill="#101b2b" stroke="#365064" stroke-width="2"/><text x="1160" y="260" font-family="Arial, sans-serif" font-size="19" fill="#d5bb72" text-anchor="start">TARGETS</text><text x="1160" y="300" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Body Mass kg: 1000, 1500, 2500</text><text x="1160" y="333" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Test s: 20</text><text x="1160" y="366" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Minimum Miss Distance m: 500</text><text x="1160" y="399" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Mass Tolerance kg: 0.001</text><path d="M75,680 L1525,680" fill="none" stroke="#365064" stroke-width="3"/><text x="75" y="725" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">WHAT YOU DO</text><text x="75" y="765" font-family="Arial, sans-serif" font-size="23" fill="#dce7ef" text-anchor="start">Assign actual source-owned tug thrust to three registered fragments; measure their drift and clear the shared</text><text x="75" y="794" font-family="Arial, sans-serif" font-size="23" fill="#dce7ef" text-anchor="start">corridor while conserving mass and momentum.</text><text x="75" y="850" font-family="Arial, sans-serif" font-size="17" fill="#94a6b8" text-anchor="start">Schematic briefing illustration. Not to scale; not a game capture. Values are test targets, not earned success.</text>
</svg>
