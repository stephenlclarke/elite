<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">The Memory Atlas</title><desc id="desc">Measurement and testimony separation Fly separated baselines and reconcile physical landmarks against measured error; private diary text cannot count as coordinates.</desc>
<rect width="1600" height="900" fill="#0b111b"/>
<rect x="35" y="30" width="1530" height="840" rx="22" fill="#101b2b" stroke="#365064"/>
<g transform="translate(0,35)"><circle cx="250" cy="250" r="36" fill="#101b2b" stroke="#75c6e9" stroke-width="3"/><text x="250" y="257" font-family="Arial, sans-serif" font-size="21" fill="#75c6e9" text-anchor="middle">A</text><circle cx="880" cy="290" r="36" fill="#101b2b" stroke="#75c6e9" stroke-width="3"/><text x="880" y="297" font-family="Arial, sans-serif" font-size="21" fill="#75c6e9" text-anchor="middle">B</text><circle cx="650" cy="500" r="36" fill="#101b2b" stroke="#75c6e9" stroke-width="3"/><text x="650" y="507" font-family="Arial, sans-serif" font-size="21" fill="#75c6e9" text-anchor="middle">C</text><path d="M250,250 L650,500" fill="none" stroke="#a3e6c2" stroke-width="3" stroke-dasharray="8 8"/><path d="M880,290 L650,500" fill="none" stroke="#a3e6c2" stroke-width="3" stroke-dasharray="8 8"/><circle cx="570" cy="350" r="65" fill="#101b2b" stroke="#a3e6c2" stroke-width="3"/><text x="570" y="357" font-family="Arial, sans-serif" font-size="21" fill="#a3e6c2" text-anchor="middle">&lt;=20 m</text><rect x="190" y="520" width="250" height="65" rx="14" fill="#101b2b" stroke="#d5bb72" stroke-width="2"/><text x="315.0" y="559.5" font-family="Arial, sans-serif" font-size="21" fill="#d5bb72" text-anchor="middle">PRIVATE DIARY</text><text x="580" y="610" font-family="Arial, sans-serif" font-size="20" fill="#dce7ef" text-anchor="middle">Measured uncertainty is public; private memories are not coordinates.</text></g>
<text x="75" y="80" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">MERIDIAN / OPERATION BRIEF</text><text x="75" y="130" font-family="Arial, sans-serif" font-size="34" fill="#dce7ef" text-anchor="start">The Memory Atlas</text><text x="75" y="173" font-family="Arial, sans-serif" font-size="20" fill="#94a6b8" text-anchor="start">Measurement and testimony separation</text><path d="M75,195 L1525,195" fill="none" stroke="#365064" stroke-width="3"/><rect x="1130" y="225" width="395" height="430" rx="14" fill="#101b2b" stroke="#365064" stroke-width="2"/><text x="1160" y="260" font-family="Arial, sans-serif" font-size="19" fill="#d5bb72" text-anchor="start">TARGETS</text><text x="1160" y="300" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Landmarks: 3</text><text x="1160" y="333" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Instrument Tests: 2</text><text x="1160" y="366" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Maximum Error m: 20</text><text x="1160" y="399" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Private Diary Fields Allowed: 0</text><path d="M75,680 L1525,680" fill="none" stroke="#365064" stroke-width="3"/><text x="75" y="725" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">WHAT YOU DO</text><text x="75" y="765" font-family="Arial, sans-serif" font-size="23" fill="#dce7ef" text-anchor="start">Fly separated baselines and reconcile physical landmarks against measured error; private diary text cannot count as</text><text x="75" y="794" font-family="Arial, sans-serif" font-size="23" fill="#dce7ef" text-anchor="start">coordinates.</text><text x="75" y="850" font-family="Arial, sans-serif" font-size="17" fill="#94a6b8" text-anchor="start">Schematic briefing illustration. Not to scale; not a game capture. Values are test targets, not earned success.</text>
</svg>
