<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Continuity inquiry</title><desc id="desc">Close inquiry Commit the new verified inquiry outcome and the same source clue receipt once.</desc>
<rect width="1600" height="900" fill="#0b111b"/>
<rect x="35" y="30" width="1530" height="840" rx="22" fill="#101b2b" stroke="#365064"/>
<g transform="translate(0,35)"><rect x="52.5" y="320" width="235.0" height="85" rx="14" fill="#101b2b" stroke="#75c6e9" stroke-width="2"/><text x="170.0" y="369.5" font-family="Arial, sans-serif" font-size="21" fill="#75c6e9" text-anchor="middle">New verified inquiry</text><rect x="442.5" y="320" width="235.0" height="85" rx="14" fill="#101b2b" stroke="#75c6e9" stroke-width="2"/><text x="560.0" y="369.5" font-family="Arial, sans-serif" font-size="21" fill="#75c6e9" text-anchor="middle">Same source clue</text><path d="M295.5,362 L434.5,362" fill="none" stroke="#75c6e9" stroke-width="3"/><polygon points="434.5,362 423.9690092573155,367.75310646325045 423.9690092573155,356.24689353674955" fill="#75c6e9"/><rect x="832.5" y="320" width="235.0" height="85" rx="14" fill="#101b2b" stroke="#75c6e9" stroke-width="2"/><text x="950.0" y="369.5" font-family="Arial, sans-serif" font-size="21" fill="#75c6e9" text-anchor="middle">Permanent journal</text><path d="M685.5,362 L824.5,362" fill="none" stroke="#75c6e9" stroke-width="3"/><polygon points="824.5,362 813.9690092573155,367.75310646325045 813.9690092573155,356.24689353674955" fill="#75c6e9"/><text x="570" y="515" font-family="Arial, sans-serif" font-size="24" fill="#a3e6c2" text-anchor="middle">One source receipt; no original reward replay</text><text x="570" y="590" font-family="Arial, sans-serif" font-size="21" fill="#94a6b8" text-anchor="middle">Hidden vessel identity and later trail instructions stay undisclosed.</text></g>
<text x="75" y="80" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">MERIDIAN / OPERATION BRIEF</text><text x="75" y="130" font-family="Arial, sans-serif" font-size="34" fill="#dce7ef" text-anchor="start">Continuity inquiry</text><text x="75" y="173" font-family="Arial, sans-serif" font-size="20" fill="#94a6b8" text-anchor="start">Close inquiry</text><path d="M75,195 L1525,195" fill="none" stroke="#365064" stroke-width="3"/><rect x="1130" y="225" width="395" height="430" rx="14" fill="#101b2b" stroke="#365064" stroke-width="2"/><text x="1160" y="260" font-family="Arial, sans-serif" font-size="19" fill="#d5bb72" text-anchor="start">TARGETS</text><text x="1160" y="300" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Required Source Count: 64</text><text x="1160" y="333" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Case Stages: 5</text><text x="1160" y="366" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Commander Charge CR: 0</text><path d="M75,680 L1525,680" fill="none" stroke="#365064" stroke-width="3"/><text x="75" y="725" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">WHAT YOU DO</text><text x="75" y="765" font-family="Arial, sans-serif" font-size="23" fill="#dce7ef" text-anchor="start">Commit the new verified inquiry outcome and the same source clue receipt once.</text><text x="75" y="850" font-family="Arial, sans-serif" font-size="17" fill="#94a6b8" text-anchor="start">Schematic briefing illustration. Not to scale; not a game capture. Values are test targets, not earned success.</text>
