<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">The Kind Distance</title><desc id="desc">Revocable anonymous reply protocol Relay two independently consented invitations; revoke a live reply lease and prove neither private address nor forced meeting is exposed.</desc>
<rect width="1600" height="900" fill="#0b111b"/>
<rect x="35" y="30" width="1530" height="840" rx="22" fill="#101b2b" stroke="#365064"/>
<g transform="translate(0,35)"><rect x="150" y="300" width="250" height="170" rx="14" fill="#101b2b" stroke="#75c6e9" stroke-width="2"/><text x="275.0" y="392.0" font-family="Arial, sans-serif" font-size="21" fill="#75c6e9" text-anchor="middle">Household A</text><rect x="770" y="300" width="250" height="170" rx="14" fill="#101b2b" stroke="#a3e6c2" stroke-width="2"/><text x="895.0" y="392.0" font-family="Arial, sans-serif" font-size="21" fill="#a3e6c2" text-anchor="middle">Household B</text><rect x="470" y="330" width="230" height="100" rx="14" fill="#101b2b" stroke="#d5bb72" stroke-width="2"/><text x="585.0" y="387.0" font-family="Arial, sans-serif" font-size="21" fill="#d5bb72" text-anchor="middle">Reply lease 120 s</text><path d="M415,355 L455,355" fill="none" stroke="#75c6e9" stroke-width="3"/><polygon points="455,355 444.4690092573155,360.75310646325045 444.4690092573155,349.24689353674955" fill="#75c6e9"/><path d="M715,405 L755,405" fill="none" stroke="#a3e6c2" stroke-width="3"/><polygon points="755,405 744.4690092573155,410.75310646325045 744.4690092573155,399.24689353674955" fill="#a3e6c2"/><circle cx="580" cy="540" r="35" fill="#101b2b" stroke="#df8d73" stroke-width="3"/><path d="M562,522 L598,558" fill="none" stroke="#df8d73" stroke-width="4"/><path d="M598,522 L562,558" fill="none" stroke="#df8d73" stroke-width="4"/><text x="580" y="605" font-family="Arial, sans-serif" font-size="18" fill="#df8d73" text-anchor="middle">REVOKE</text><text x="580" y="240" font-family="Arial, sans-serif" font-size="22" fill="#dce7ef" text-anchor="middle">Invitation without forced meeting or address disclosure</text></g>
<text x="75" y="80" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">MERIDIAN / OPERATION BRIEF</text><text x="75" y="130" font-family="Arial, sans-serif" font-size="34" fill="#dce7ef" text-anchor="start">The Kind Distance</text><text x="75" y="173" font-family="Arial, sans-serif" font-size="20" fill="#94a6b8" text-anchor="start">Revocable anonymous reply protocol</text><path d="M75,195 L1525,195" fill="none" stroke="#365064" stroke-width="3"/><rect x="1130" y="225" width="395" height="430" rx="14" fill="#101b2b" stroke="#365064" stroke-width="2"/><text x="1160" y="260" font-family="Arial, sans-serif" font-size="19" fill="#d5bb72" text-anchor="start">TARGETS</text><text x="1160" y="300" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Households: 2</text><text x="1160" y="333" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Challenge Attempts: 2</text><text x="1160" y="366" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Invitation Lease s: 120</text><text x="1160" y="399" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Public Address Fields Allowed: 0</text><path d="M75,680 L1525,680" fill="none" stroke="#365064" stroke-width="3"/><text x="75" y="725" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">WHAT YOU DO</text><text x="75" y="765" font-family="Arial, sans-serif" font-size="23" fill="#dce7ef" text-anchor="start">Relay two independently consented invitations; revoke a live reply lease and prove neither private address nor</text><text x="75" y="794" font-family="Arial, sans-serif" font-size="23" fill="#dce7ef" text-anchor="start">forced meeting is exposed.</text><text x="75" y="850" font-family="Arial, sans-serif" font-size="17" fill="#94a6b8" text-anchor="start">Schematic briefing illustration. Not to scale; not a game capture. Values are test targets, not earned success.</text>
</svg>
