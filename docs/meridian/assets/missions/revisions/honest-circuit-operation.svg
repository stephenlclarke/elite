<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">The Honest Circuit</title><desc id="desc">Fuel-accounted flight certification Fly both ordered physical gates at5-30m/s with real traffic separation; an unsafe approach aborts the trial without refunding spent fuel.</desc>
