<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Borrowed Dawn</title><desc id="desc">Reflector stop and thermal cutoff Steer the two source-owned reflectors with directional controls; release controls at the actual illumination stop and test the thermal trip.</desc>
<rect width="1600" height="900" fill="#0b111b"/>
<rect x="35" y="30" width="1530" height="840" rx="22" fill="#101b2b" stroke="#365064"/>
<g transform="translate(0,35)"><circle cx="160" cy="350" r="45" fill="#101b2b" stroke="#d5bb72" stroke-width="3"/><text x="160" y="357" font-family="Arial, sans-serif" font-size="21" fill="#d5bb72" text-anchor="middle">LIGHT</text><path d="M405,365 L495,235" fill="none" stroke="#a3e6c2" stroke-width="10"/><circle cx="450" cy="300" r="12" fill="#101b2b" stroke="#a3e6c2" stroke-width="3"/><path d="M705,485 L795,355" fill="none" stroke="#a3e6c2" stroke-width="10"/><circle cx="750" cy="420" r="12" fill="#101b2b" stroke="#a3e6c2" stroke-width="3"/><path d="M215,350 L430,315" fill="none" stroke="#d5bb72" stroke-width="3"/><polygon points="430,315 420.53021942222244,322.3704311820101 418.6814517325766,311.0137153741854" fill="#d5bb72"/><path d="M470,315 L730,405" fill="none" stroke="#d5bb72" stroke-width="3"/><polygon points="730,405 718.1664585093612,406.99180716670287 721.9302623079086,396.1185961931213" fill="#d5bb72"/><path d="M780,410 L980,310" fill="none" stroke="#d5bb72" stroke-width="3"/><polygon points="980,310 973.1536629582989,319.85533708766127 968.0079281048503,309.5638673807641" fill="#d5bb72"/><rect x="300" y="525" width="600" height="55" rx="14" fill="#101b2b" stroke="#a3e6c2" stroke-width="2"/><text x="600.0" y="559.5" font-family="Arial, sans-serif" font-size="21" fill="#a3e6c2" text-anchor="middle">40-70 safe illumination / trip at 80</text><text x="580" y="235" font-family="Arial, sans-serif" font-size="23" fill="#dce7ef" text-anchor="middle">Adjust both real reflector stops</text></g>
<text x="75" y="80" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">MERIDIAN / OPERATION BRIEF</text><text x="75" y="130" font-family="Arial, sans-serif" font-size="34" fill="#dce7ef" text-anchor="start">Borrowed Dawn</text><text x="75" y="173" font-family="Arial, sans-serif" font-size="20" fill="#94a6b8" text-anchor="start">Reflector stop and thermal cutoff</text><path d="M75,195 L1525,195" fill="none" stroke="#365064" stroke-width="3"/><rect x="1130" y="225" width="395" height="430" rx="14" fill="#101b2b" stroke="#365064" stroke-width="2"/><text x="1160" y="260" font-family="Arial, sans-serif" font-size="19" fill="#d5bb72" text-anchor="start">TARGETS</text><text x="1160" y="300" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Safe Illumination Min: 40</text><text x="1160" y="333" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Safe Illumination Max: 70</text><text x="1160" y="366" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Overheat Trip: 80</text><text x="1160" y="399" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Test s: 18</text><path d="M75,680 L1525,680" fill="none" stroke="#365064" stroke-width="3"/><text x="75" y="725" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">WHAT YOU DO</text><text x="75" y="765" font-family="Arial, sans-serif" font-size="23" fill="#dce7ef" text-anchor="start">Steer the two source-owned reflectors with directional controls; release controls at the actual illumination stop</text><text x="75" y="794" font-family="Arial, sans-serif" font-size="23" fill="#dce7ef" text-anchor="start">and test the thermal trip.</text><text x="75" y="850" font-family="Arial, sans-serif" font-size="17" fill="#94a6b8" text-anchor="start">Schematic briefing illustration. Not to scale; not a game capture. Values are test targets, not earned success.</text>
</svg>
