<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Small Lights</title><desc id="desc">Dependency fault isolation and response Isolate the actual dependency fault, fit exactly two real repair kits, then run either the timed callout or separately stocked reserve drill.</desc>
