<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">The Listening Frontier</title><desc id="desc">Reciprocal quiet-window timing Tune and leave the channel silent through human/Larvaal/quiet windows, then send only in the actual allocated reply window.</desc>
<rect width="1600" height="900" fill="#0b111b"/>
<rect x="35" y="30" width="1530" height="840" rx="22" fill="#101b2b" stroke="#365064"/>
<g transform="translate(0,35)"><rect x="175" y="265" width="270" height="75" rx="14" fill="#101b2b" stroke="#75c6e9" stroke-width="2"/><text x="310.0" y="309.5" font-family="Arial, sans-serif" font-size="21" fill="#75c6e9" text-anchor="middle">Human 4 s</text><rect x="465" y="265" width="270" height="75" rx="14" fill="#101b2b" stroke="#a3e6c2" stroke-width="2"/><text x="600.0" y="309.5" font-family="Arial, sans-serif" font-size="21" fill="#a3e6c2" text-anchor="middle">Larvaal 4 s</text><rect x="755" y="265" width="270" height="75" rx="14" fill="#101b2b" stroke="#d5bb72" stroke-width="2"/><text x="890.0" y="309.5" font-family="Arial, sans-serif" font-size="21" fill="#d5bb72" text-anchor="middle">Quiet 4 s</text><rect x="175" y="370" width="270" height="75" rx="14" fill="#101b2b" stroke="#75c6e9" stroke-width="2"/><text x="310.0" y="414.5" font-family="Arial, sans-serif" font-size="21" fill="#75c6e9" text-anchor="middle">Human 4 s</text><rect x="465" y="370" width="270" height="75" rx="14" fill="#101b2b" stroke="#a3e6c2" stroke-width="2"/><text x="600.0" y="414.5" font-family="Arial, sans-serif" font-size="21" fill="#a3e6c2" text-anchor="middle">Larvaal 4 s</text><rect x="755" y="370" width="270" height="75" rx="14" fill="#101b2b" stroke="#d5bb72" stroke-width="2"/><text x="890.0" y="414.5" font-family="Arial, sans-serif" font-size="21" fill="#d5bb72" text-anchor="middle">Quiet 4 s</text><rect x="175" y="475" width="270" height="75" rx="14" fill="#101b2b" stroke="#75c6e9" stroke-width="2"/><text x="310.0" y="519.5" font-family="Arial, sans-serif" font-size="21" fill="#75c6e9" text-anchor="middle">Human 4 s</text><rect x="465" y="475" width="270" height="75" rx="14" fill="#101b2b" stroke="#a3e6c2" stroke-width="2"/><text x="600.0" y="519.5" font-family="Arial, sans-serif" font-size="21" fill="#a3e6c2" text-anchor="middle">Larvaal 4 s</text><rect x="755" y="475" width="270" height="75" rx="14" fill="#101b2b" stroke="#d5bb72" stroke-width="2"/><text x="890.0" y="519.5" font-family="Arial, sans-serif" font-size="21" fill="#d5bb72" text-anchor="middle">Quiet 4 s</text><text x="570" y="220" font-family="Arial, sans-serif" font-size="24" fill="#dce7ef" text-anchor="middle">Three complete 12-second cycles</text><text x="570" y="620" font-family="Arial, sans-serif" font-size="21" fill="#94a6b8" text-anchor="middle">Listen, allocate, then reply only in the actual window.</text></g>
<text x="75" y="80" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">MERIDIAN / OPERATION BRIEF</text><text x="75" y="130" font-family="Arial, sans-serif" font-size="34" fill="#dce7ef" text-anchor="start">The Listening Frontier</text><text x="75" y="173" font-family="Arial, sans-serif" font-size="20" fill="#94a6b8" text-anchor="start">Reciprocal quiet-window timing</text><path d="M75,195 L1525,195" fill="none" stroke="#365064" stroke-width="3"/><rect x="1130" y="225" width="395" height="430" rx="14" fill="#101b2b" stroke="#365064" stroke-width="2"/><text x="1160" y="260" font-family="Arial, sans-serif" font-size="19" fill="#d5bb72" text-anchor="start">TARGETS</text><text x="1160" y="300" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Cycle s: 12</text><text x="1160" y="333" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Human Window s: 4</text><text x="1160" y="366" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Larvaal Window s: 4</text><text x="1160" y="399" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Quiet s: 4</text><text x="1160" y="432" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Test Cycles: 3</text><path d="M75,680 L1525,680" fill="none" stroke="#365064" stroke-width="3"/><text x="75" y="725" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">WHAT YOU DO</text><text x="75" y="765" font-family="Arial, sans-serif" font-size="23" fill="#dce7ef" text-anchor="start">Tune and leave the channel silent through human/Larvaal/quiet windows, then send only in the actual allocated reply</text><text x="75" y="794" font-family="Arial, sans-serif" font-size="23" fill="#dce7ef" text-anchor="start">window.</text><text x="75" y="850" font-family="Arial, sans-serif" font-size="17" fill="#94a6b8" text-anchor="start">Schematic briefing illustration. Not to scale; not a game capture. Values are test targets, not earned success.</text>
</svg>
