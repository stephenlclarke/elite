<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Harbour Without Orders</title><desc id="desc">Simultaneous berth-allocation exclusion Submit two simultaneous real berth claims to one allocator; revoke the losing lease and physically prove mutual exclusion.</desc>
<rect width="1600" height="900" fill="#0b111b"/>
<rect x="35" y="30" width="1530" height="840" rx="22" fill="#101b2b" stroke="#365064"/>
<g transform="translate(0,35)"><rect x="170" y="240" width="220" height="75" rx="14" fill="#101b2b" stroke="#75c6e9" stroke-width="2"/><text x="280.0" y="284.5" font-family="Arial, sans-serif" font-size="21" fill="#75c6e9" text-anchor="middle">Claim A</text><rect x="170" y="390" width="220" height="75" rx="14" fill="#101b2b" stroke="#d5bb72" stroke-width="2"/><text x="280.0" y="434.5" font-family="Arial, sans-serif" font-size="21" fill="#d5bb72" text-anchor="middle">Claim B</text><rect x="720" y="310" width="270" height="105" rx="14" fill="#101b2b" stroke="#a3e6c2" stroke-width="2"/><text x="855.0" y="369.5" font-family="Arial, sans-serif" font-size="21" fill="#a3e6c2" text-anchor="middle">ONE REAL BERTH</text><path d="M405,280 L700,340" fill="none" stroke="#75c6e9" stroke-width="3"/><polygon points="700,340 688.5336493126373,343.5387571143577 690.8269428497107,332.26339722374695" fill="#75c6e9"/><path d="M405,430 L620,380" fill="none" stroke="#d5bb72" stroke-width="3"/><polygon points="620,380 611.0458867340933,387.9889833909775 608.4395742338064,376.7818396397435" fill="#d5bb72"/><circle cx="640" cy="390" r="35" fill="#101b2b" stroke="#df8d73" stroke-width="3"/><path d="M622,372 L658,408" fill="none" stroke="#df8d73" stroke-width="4"/><path d="M658,372 L622,408" fill="none" stroke="#df8d73" stroke-width="4"/><text x="640" y="455" font-family="Arial, sans-serif" font-size="18" fill="#df8d73" text-anchor="middle">WAIT / NO DOUBLE CLAIM</text><text x="190" y="560" font-family="Arial, sans-serif" font-size="21" fill="#dce7ef" text-anchor="start">120 s lease / minimum 20 s separation / explicit revocation</text></g>
<text x="75" y="80" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">MERIDIAN / OPERATION BRIEF</text><text x="75" y="130" font-family="Arial, sans-serif" font-size="34" fill="#dce7ef" text-anchor="start">Harbour Without Orders</text><text x="75" y="173" font-family="Arial, sans-serif" font-size="20" fill="#94a6b8" text-anchor="start">Simultaneous berth-allocation exclusion</text><path d="M75,195 L1525,195" fill="none" stroke="#365064" stroke-width="3"/><rect x="1130" y="225" width="395" height="430" rx="14" fill="#101b2b" stroke="#365064" stroke-width="2"/><text x="1160" y="260" font-family="Arial, sans-serif" font-size="19" fill="#d5bb72" text-anchor="start">TARGETS</text><text x="1160" y="300" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Test Requests: 2</text><text x="1160" y="333" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Berth Capacity: 1</text><text x="1160" y="366" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Authority Lease s: 120</text><text x="1160" y="399" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Minimum Separation s: 20</text><path d="M75,680 L1525,680" fill="none" stroke="#365064" stroke-width="3"/><text x="75" y="725" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">WHAT YOU DO</text><text x="75" y="765" font-family="Arial, sans-serif" font-size="23" fill="#dce7ef" text-anchor="start">Submit two simultaneous real berth claims to one allocator; revoke the losing lease and physically prove mutual</text><text x="75" y="794" font-family="Arial, sans-serif" font-size="23" fill="#dce7ef" text-anchor="start">exclusion.</text><text x="75" y="850" font-family="Arial, sans-serif" font-size="17" fill="#94a6b8" text-anchor="start">Schematic briefing illustration. Not to scale; not a game capture. Values are test targets, not earned success.</text>
</svg>
