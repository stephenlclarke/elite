<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Uncounted Names</title><desc id="desc">Personhood and receiving-permission correction Obtain three actual peoples separate permissions and apply only their chosen access grants; test denial without exporting their identities.</desc>
