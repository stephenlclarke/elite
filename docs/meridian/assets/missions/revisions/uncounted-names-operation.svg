<rect x="35" y="30" width="1530" height="840" rx="22" fill="#101b2b" stroke="#365064"/>
<g transform="translate(0,35)"><circle cx="260" cy="295" r="42" fill="#101b2b" stroke="#a3e6c2" stroke-width="3"/><text x="260" y="302" font-family="Arial, sans-serif" font-size="21" fill="#a3e6c2" text-anchor="middle">1</text><rect x="160" y="370" width="200" height="110" rx="14" fill="#101b2b" stroke="#a3e6c2" stroke-width="2"/><text x="260.0" y="432.0" font-family="Arial, sans-serif" font-size="21" fill="#a3e6c2" text-anchor="middle">CONSENT</text><circle cx="570" cy="295" r="42" fill="#101b2b" stroke="#a3e6c2" stroke-width="3"/><text x="570" y="302" font-family="Arial, sans-serif" font-size="21" fill="#a3e6c2" text-anchor="middle">2</text><rect x="470" y="370" width="200" height="110" rx="14" fill="#101b2b" stroke="#a3e6c2" stroke-width="2"/><text x="570.0" y="432.0" font-family="Arial, sans-serif" font-size="21" fill="#a3e6c2" text-anchor="middle">CONSENT</text><circle cx="880" cy="295" r="42" fill="#101b2b" stroke="#a3e6c2" stroke-width="3"/><text x="880" y="302" font-family="Arial, sans-serif" font-size="21" fill="#a3e6c2" text-anchor="middle">3</text><rect x="780" y="370" width="200" height="110" rx="14" fill="#101b2b" stroke="#a3e6c2" stroke-width="2"/><text x="880.0" y="432.0" font-family="Arial, sans-serif" font-size="21" fill="#a3e6c2" text-anchor="middle">CONSENT</text><text x="580" y="540" font-family="Arial, sans-serif" font-size="24" fill="#dce7ef" text-anchor="middle">Two permissions tested separately</text><text x="580" y="590" font-family="Arial, sans-serif" font-size="22" fill="#d5bb72" text-anchor="middle">Three living people / zero commodity transfers</text></g>
<text x="75" y="80" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">MERIDIAN / OPERATION BRIEF</text><text x="75" y="130" font-family="Arial, sans-serif" font-size="34" fill="#dce7ef" text-anchor="start">Uncounted Names</text><text x="75" y="173" font-family="Arial, sans-serif" font-size="20" fill="#94a6b8" text-anchor="start">Personhood and receiving-permission correction</text><path d="M75,195 L1525,195" fill="none" stroke="#365064" stroke-width="3"/><rect x="1130" y="225" width="395" height="430" rx="14" fill="#101b2b" stroke="#365064" stroke-width="2"/><text x="1160" y="260" font-family="Arial, sans-serif" font-size="19" fill="#d5bb72" text-anchor="start">TARGETS</text><text x="1160" y="300" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">People: 3</text><text x="1160" y="333" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Permission Tests: 2</text><text x="1160" y="366" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Commodity Transfers Allowed: 0</text><path d="M75,680 L1525,680" fill="none" stroke="#365064" stroke-width="3"/><text x="75" y="725" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">WHAT YOU DO</text><text x="75" y="765" font-family="Arial, sans-serif" font-size="23" fill="#dce7ef" text-anchor="start">Obtain three actual peoples separate permissions and apply only their chosen access grants; test denial without</text><text x="75" y="794" font-family="Arial, sans-serif" font-size="23" fill="#dce7ef" text-anchor="start">exporting their identities.</text><text x="75" y="850" font-family="Arial, sans-serif" font-size="17" fill="#94a6b8" text-anchor="start">Schematic briefing illustration. Not to scale; not a game capture. Values are test targets, not earned success.</text>
</svg>
