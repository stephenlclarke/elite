<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">The Witness Window</title><desc id="desc">Evidence escrow and privacy-preserving release Compare the three consented archive copies, challenge the two independent keys and verify the sealed or anonymised receiving outcome.</desc>
<rect width="1600" height="900" fill="#0b111b"/>
<rect x="35" y="30" width="1530" height="840" rx="22" fill="#101b2b" stroke="#365064"/>
<g transform="translate(0,35)"><rect x="165" y="235" width="240" height="90" rx="14" fill="#101b2b" stroke="#a3e6c2" stroke-width="2"/><text x="285.0" y="287.0" font-family="Arial, sans-serif" font-size="21" fill="#a3e6c2" text-anchor="middle">Consented copy 1</text><rect x="470" y="235" width="240" height="90" rx="14" fill="#101b2b" stroke="#a3e6c2" stroke-width="2"/><text x="590.0" y="287.0" font-family="Arial, sans-serif" font-size="21" fill="#a3e6c2" text-anchor="middle">Consented copy 2</text><rect x="775" y="235" width="240" height="90" rx="14" fill="#101b2b" stroke="#a3e6c2" stroke-width="2"/><text x="895.0" y="287.0" font-family="Arial, sans-serif" font-size="21" fill="#a3e6c2" text-anchor="middle">Consented copy 3</text><rect x="260" y="410" width="260" height="85" rx="14" fill="#101b2b" stroke="#75c6e9" stroke-width="2"/><text x="390.0" y="459.5" font-family="Arial, sans-serif" font-size="21" fill="#75c6e9" text-anchor="middle">Custody key A</text><rect x="650" y="410" width="260" height="85" rx="14" fill="#101b2b" stroke="#75c6e9" stroke-width="2"/><text x="780.0" y="459.5" font-family="Arial, sans-serif" font-size="21" fill="#75c6e9" text-anchor="middle">Custody key B</text><path d="M570,340 L570,390" fill="none" stroke="#a3e6c2" stroke-width="3"/><polygon points="570,390 564.2468935367496,379.4690092573155 575.7531064632504,379.4690092573155" fill="#a3e6c2"/><text x="580" y="560" font-family="Arial, sans-serif" font-size="23" fill="#d5bb72" text-anchor="middle">Preservation hold precedes the offer; no hidden expiry.</text><text x="580" y="610" font-family="Arial, sans-serif" font-size="21" fill="#dce7ef" text-anchor="middle">Two independent challenges / private fields stay sealed</text></g>
<text x="75" y="80" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">MERIDIAN / OPERATION BRIEF</text><text x="75" y="130" font-family="Arial, sans-serif" font-size="34" fill="#dce7ef" text-anchor="start">The Witness Window</text><text x="75" y="173" font-family="Arial, sans-serif" font-size="20" fill="#94a6b8" text-anchor="start">Evidence escrow and privacy-preserving release</text><path d="M75,195 L1525,195" fill="none" stroke="#365064" stroke-width="3"/><rect x="1130" y="225" width="395" height="430" rx="14" fill="#101b2b" stroke="#365064" stroke-width="2"/><text x="1160" y="260" font-family="Arial, sans-serif" font-size="19" fill="#d5bb72" text-anchor="start">TARGETS</text><text x="1160" y="300" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Copies: 3</text><text x="1160" y="333" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Independent Custody Keys: 2</text><text x="1160" y="366" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Public Private Fields Allowed: 0</text><text x="1160" y="399" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Challenge Packets: 2</text><path d="M75,680 L1525,680" fill="none" stroke="#365064" stroke-width="3"/><text x="75" y="725" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">WHAT YOU DO</text><text x="75" y="765" font-family="Arial, sans-serif" font-size="23" fill="#dce7ef" text-anchor="start">Compare the three consented archive copies, challenge the two independent keys and verify the sealed or anonymised</text><text x="75" y="794" font-family="Arial, sans-serif" font-size="23" fill="#dce7ef" text-anchor="start">receiving outcome.</text><text x="75" y="850" font-family="Arial, sans-serif" font-size="17" fill="#94a6b8" text-anchor="start">Schematic briefing illustration. Not to scale; not a game capture. Values are test targets, not earned success.</text>
</svg>
