<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Under Tow</title><desc id="desc">Coupler geometry and load testing Direct two real source-owned couplers/tugs into engagement; apply measured test load, verify release above the limit, and conduct actual tow reception.</desc>
<rect width="1600" height="900" fill="#0b111b"/>
<rect x="35" y="30" width="1530" height="840" rx="22" fill="#101b2b" stroke="#365064"/>
<g transform="translate(0,35)"><circle cx="300" cy="355" r="85" fill="#101b2b" stroke="#75c6e9" stroke-width="3"/><text x="300" y="362" font-family="Arial, sans-serif" font-size="21" fill="#75c6e9" text-anchor="middle">2 m</text><circle cx="835" cy="355" r="125" fill="#101b2b" stroke="#a3e6c2" stroke-width="3"/><text x="835" y="362" font-family="Arial, sans-serif" font-size="21" fill="#a3e6c2" text-anchor="middle">3 m</text><path d="M395,355 L690,355" fill="none" stroke="#d5bb72" stroke-width="8"/><rect x="410" y="500" width="310" height="65" rx="14" fill="#101b2b" stroke="#a3e6c2" stroke-width="2"/><text x="565.0" y="539.5" font-family="Arial, sans-serif" font-size="21" fill="#a3e6c2" text-anchor="middle">50 load /15 s hold</text><text x="570" y="230" font-family="Arial, sans-serif" font-size="24" fill="#dce7ef" text-anchor="middle">Verify both physical couplers</text><text x="570" y="605" font-family="Arial, sans-serif" font-size="21" fill="#df8d73" text-anchor="middle">Release above 60;61 must fail the overload test.</text></g>
<text x="75" y="80" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">MERIDIAN / OPERATION BRIEF</text><text x="75" y="130" font-family="Arial, sans-serif" font-size="34" fill="#dce7ef" text-anchor="start">Under Tow</text><text x="75" y="173" font-family="Arial, sans-serif" font-size="20" fill="#94a6b8" text-anchor="start">Coupler geometry and load testing</text><path d="M75,195 L1525,195" fill="none" stroke="#365064" stroke-width="3"/><rect x="1130" y="225" width="395" height="430" rx="14" fill="#101b2b" stroke="#365064" stroke-width="2"/><text x="1160" y="260" font-family="Arial, sans-serif" font-size="19" fill="#d5bb72" text-anchor="start">TARGETS</text><text x="1160" y="300" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Coupler Diameters m: 2, 3</text><text x="1160" y="333" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Test Load units: 50</text><text x="1160" y="366" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Limit units: 60</text><text x="1160" y="399" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Test s: 15</text><path d="M75,680 L1525,680" fill="none" stroke="#365064" stroke-width="3"/><text x="75" y="725" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">WHAT YOU DO</text><text x="75" y="765" font-family="Arial, sans-serif" font-size="23" fill="#dce7ef" text-anchor="start">Direct two real source-owned couplers/tugs into engagement; apply measured test load, verify release above the</text><text x="75" y="794" font-family="Arial, sans-serif" font-size="23" fill="#dce7ef" text-anchor="start">limit, and conduct actual tow reception.</text><text x="75" y="850" font-family="Arial, sans-serif" font-size="17" fill="#94a6b8" text-anchor="start">Schematic briefing illustration. Not to scale; not a game capture. Values are test targets, not earned success.</text>
</svg>
