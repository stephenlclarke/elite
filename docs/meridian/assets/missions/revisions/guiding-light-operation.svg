<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">The Guiding Light</title><desc id="desc">Shadow sight-line and overlapping beacon coverage Fly the three lantern sightlines, align two winter relays and verify a lit safe receiving path through the current actual shadow geometry.</desc>
<rect width="1600" height="900" fill="#0b111b"/>
<rect x="35" y="30" width="1530" height="840" rx="22" fill="#101b2b" stroke="#365064"/>
<g transform="translate(0,35)"><circle cx="220" cy="310" r="35" fill="#101b2b" stroke="#d5bb72" stroke-width="3"/><text x="220" y="317" font-family="Arial, sans-serif" font-size="21" fill="#d5bb72" text-anchor="middle">1</text><circle cx="560" cy="230" r="35" fill="#101b2b" stroke="#d5bb72" stroke-width="3"/><text x="560" y="237" font-family="Arial, sans-serif" font-size="21" fill="#d5bb72" text-anchor="middle">2</text><circle cx="930" cy="380" r="35" fill="#101b2b" stroke="#d5bb72" stroke-width="3"/><text x="930" y="387" font-family="Arial, sans-serif" font-size="21" fill="#d5bb72" text-anchor="middle">3</text><path d="M220,310 L560,230" fill="none" stroke="#d5bb72" stroke-width="3"/><path d="M560,230 L930,380" fill="none" stroke="#d5bb72" stroke-width="3"/><rect x="300" y="435" width="160" height="70" rx="14" fill="#101b2b" stroke="#a3e6c2" stroke-width="2"/><text x="380.0" y="477.0" font-family="Arial, sans-serif" font-size="21" fill="#a3e6c2" text-anchor="middle">RELAY</text><path d="M380,470 L320,370" fill="none" stroke="#a3e6c2" stroke-width="3"/><rect x="670" y="470" width="160" height="70" rx="14" fill="#101b2b" stroke="#a3e6c2" stroke-width="2"/><text x="750.0" y="512.0" font-family="Arial, sans-serif" font-size="21" fill="#a3e6c2" text-anchor="middle">RELAY</text><path d="M750,505 L690,405" fill="none" stroke="#a3e6c2" stroke-width="3"/><text x="580" y="600" font-family="Arial, sans-serif" font-size="21" fill="#dce7ef" text-anchor="middle">Three lantern sightlines / two relays / overlap&gt;=5 degrees /12 s</text></g>
<text x="75" y="80" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">MERIDIAN / OPERATION BRIEF</text><text x="75" y="130" font-family="Arial, sans-serif" font-size="34" fill="#dce7ef" text-anchor="start">The Guiding Light</text><text x="75" y="173" font-family="Arial, sans-serif" font-size="20" fill="#94a6b8" text-anchor="start">Shadow sight-line and overlapping beacon coverage</text><path d="M75,195 L1525,195" fill="none" stroke="#365064" stroke-width="3"/><rect x="1130" y="225" width="395" height="430" rx="14" fill="#101b2b" stroke="#365064" stroke-width="2"/><text x="1160" y="260" font-family="Arial, sans-serif" font-size="19" fill="#d5bb72" text-anchor="start">TARGETS</text><text x="1160" y="300" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Lanterns: 3</text><text x="1160" y="333" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Minimum Overlap Degrees: 5</text><text x="1160" y="366" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Test s: 12</text><text x="1160" y="399" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Repaired Relays: 2</text><path d="M75,680 L1525,680" fill="none" stroke="#365064" stroke-width="3"/><text x="75" y="725" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">WHAT YOU DO</text><text x="75" y="765" font-family="Arial, sans-serif" font-size="23" fill="#dce7ef" text-anchor="start">Fly the three lantern sightlines, align two winter relays and verify a lit safe receiving path through the current</text><text x="75" y="794" font-family="Arial, sans-serif" font-size="23" fill="#dce7ef" text-anchor="start">actual shadow geometry.</text><text x="75" y="850" font-family="Arial, sans-serif" font-size="17" fill="#94a6b8" text-anchor="start">Schematic briefing illustration. Not to scale; not a game capture. Values are test targets, not earned success