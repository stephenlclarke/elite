<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Open Measure</title><desc id="desc">Independent tolerance and fit verification Apply the known reference load to both actual component mounts; compare fit and tolerance before publishing their calibrated specification.</desc>
<rect width="1600" height="900" fill="#0b111b"/>
<rect x="35" y="30" width="1530" height="840" rx="22" fill="#101b2b" stroke="#365064"/>
<g transform="translate(0,35)"><rect x="440" y="220" width="260" height="85" rx="14" fill="#101b2b" stroke="#d5bb72" stroke-width="2"/><text x="570.0" y="269.5" font-family="Arial, sans-serif" font-size="21" fill="#d5bb72" text-anchor="middle">Reference load 100</text><rect x="260" y="405" width="200" height="120" rx="14" fill="#101b2b" stroke="#75c6e9" stroke-width="2"/><text x="360.0" y="472.0" font-family="Arial, sans-serif" font-size="21" fill="#75c6e9" text-anchor="middle">MOUNT</text><path d="M570,320 L360,390" fill="none" stroke="#a3e6c2" stroke-width="3"/><polygon points="360,390 368.1712830249786,381.21193230990474 371.80986703404005,392.127684337089" fill="#a3e6c2"/><rect x="760" y="405" width="200" height="120" rx="14" fill="#101b2b" stroke="#75c6e9" stroke-width="2"/><text x="860.0" y="472.0" font-family="Arial, sans-serif" font-size="21" fill="#75c6e9" text-anchor="middle">MOUNT</text><path d="M570,320 L860,390" fill="none" stroke="#a3e6c2" stroke-width="3"/><polygon points="860,390 848.4130992928459,393.12149515497805 851.112923227927,381.9365102810706" fill="#a3e6c2"/><text x="580" y="590" font-family="Arial, sans-serif" font-size="23" fill="#a3e6c2" text-anchor="middle">Two real independent parts / error&lt;=1 load unit</text></g>
<text x="75" y="80" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">MERIDIAN / OPERATION BRIEF</text><text x="75" y="130" font-family="Arial, sans-serif" font-size="34" fill="#dce7ef" text-anchor="start">Open Measure</text><text x="75" y="173" font-family="Arial, sans-serif" font-size="20" fill="#94a6b8" text-anchor="start">Independent tolerance and fit verification</text><path d="M75,195 L1525,195" fill="none" stroke="#365064" stroke-width="3"/><rect x="1130" y="225" width="395" height="430" rx="14" fill="#101b2b" stroke="#365064" stroke-width="2"/><text x="1160" y="260" font-family="Arial, sans-serif" font-size="19" fill="#d5bb72" text-anchor="start">TARGETS</text><text x="1160" y="300" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Reference Load units: 100</text><text x="1160" y="333" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Allowed Error units: 1</text><text x="1160" y="366" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Independent Parts: 2</text><path d="M75,680 L1525,680" fill="none" stroke="#365064" stroke-width="3"/><text x="75" y="725" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">WHAT YOU DO</text><text x="75" y="765" font-family="Arial, sans-serif" font-size="23" fill="#dce7ef" text-anchor="start">Apply the known reference load to both actual component mounts; compare fit and tolerance before publishing their</text><text x="75" y="794" font-family="Arial, sans-serif" font-size="23" fill="#dce7ef" text-anchor="start">calibrated specification.</text><text x="75" y="850" font-family="Arial, sans-serif" font-size="17" fill="#94a6b8" text-anchor="start">Schematic briefing illustration. Not to scale; not a game capture. Values are test targets, not earned success.</text>
</svg>
