<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">The Warrant Ledger</title><desc id="desc">Conflicting-evidence adjudication Trace the three signed issuer records, present the two independent victim challenges and reject reused evidence before revocation/reissue.</desc>
<rect width="1600" height="900" fill="#0b111b"/>
<rect x="35" y="30" width="1530" height="840" rx="22" fill="#101b2b" stroke="#365064"/>
<g transform="translate(0,35)"><rect x="180" y="240" width="220" height="90" rx="14" fill="#101b2b" stroke="#75c6e9" stroke-width="2"/><text x="290.0" y="292.0" font-family="Arial, sans-serif" font-size="21" fill="#75c6e9" text-anchor="middle">Issuer record 1</text><rect x="475" y="240" width="220" height="90" rx="14" fill="#101b2b" stroke="#75c6e9" stroke-width="2"/><text x="585.0" y="292.0" font-family="Arial, sans-serif" font-size="21" fill="#75c6e9" text-anchor="middle">Issuer record 2</text><rect x="770" y="240" width="220" height="90" rx="14" fill="#101b2b" stroke="#75c6e9" stroke-width="2"/><text x="880.0" y="292.0" font-family="Arial, sans-serif" font-size="21" fill="#75c6e9" text-anchor="middle">Issuer record 3</text><rect x="250" y="430" width="250" height="90" rx="14" fill="#101b2b" stroke="#a3e6c2" stroke-width="2"/><text x="375.0" y="482.0" font-family="Arial, sans-serif" font-size="21" fill="#a3e6c2" text-anchor="middle">Victim challenge A</text><rect x="690" y="430" width="250" height="90" rx="14" fill="#101b2b" stroke="#a3e6c2" stroke-width="2"/><text x="815.0" y="482.0" font-family="Arial, sans-serif" font-size="21" fill="#a3e6c2" text-anchor="middle">Victim challenge B</text><path d="M290,345 L370,415" fill="none" stroke="#75c6e9" stroke-width="3"/><polygon points="370,415 358.28617467927324,412.39494791693136 365.86306891049037,403.73564022411176" fill="#75c6e9"/><path d="M585,345 L815,415" fill="none" stroke="#75c6e9" stroke-width="3"/><polygon points="815,415 803.2501924478258,417.43762640428554 806.6003599950456,406.4299330348492" fill="#75c6e9"/><path d="M880,345 L815,415" fill="none" stroke="#75c6e9" stroke-width="3"/><polygon points="815,415 817.9499852553831,403.3682509056883 826.3816632011894,411.19766614107976" fill="#75c6e9"/><text x="580" y="590" font-family="Arial, sans-serif" font-size="22" fill="#d5bb72" text-anchor="middle">Independent signatures / reused evidence rejected</text></g>
<text x="75" y="80" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">MERIDIAN / OPERATION BRIEF</text><text x="75" y="130" font-family="Arial, sans-serif" font-size="34" fill="#dce7ef" text-anchor="start">The Warrant Ledger</text><text x="75" y="173" font-family="Arial, sans-serif" font-size="20" fill="#94a6b8" text-anchor="start">Conflicting-evidence adjudication</text><path d="M75,195 L1525,195" fill="none" stroke="#365064" stroke-width="3"/><rect x="1130" y="225" width="395" height="430" rx="14" fill="#101b2b" stroke="#365064" stroke-width="2"/><text x="1160" y="260" font-family="Arial, sans-serif" font-size="19" fill="#d5bb72" text-anchor="start">TARGETS</text><text x="1160" y="300" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Issuer Records: 3</text><text x="1160" y="333" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Disputed Victim Records: 2</text><text x="1160" y="366" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Duplicate Evidence Uses Allowed: 0</text><path d="M75,680 L1525,680" fill="none" stroke="#365064" stroke-width="3"/><text x="75" y="725" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">WHAT YOU DO</text><text x="75" y="765" font-family="Arial, sans-serif" font-size="23" fill="#dce7ef" text-anchor="start">Trace the three signed issuer records, present the two independent victim challenges and reject reused evidence</text><text x="75" y="794" font-family="Arial, sans-serif" font-size="23" fill="#dce7ef" text-anchor="start">before revocation/reissue.</text><text x="75" y="850" font-family="Arial, sans-serif" font-size="17" fill="#94a6b8" text-anchor="start">Schematic briefing illustration. Not to scale; not a game capture. Values are test targets, not earned success.</text>
</svg>
