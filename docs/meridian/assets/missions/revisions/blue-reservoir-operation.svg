<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">The Blue Reservoir</title><desc id="desc">Closed fluid-flow balancing Open/close the two source-owned sealed bypass valves; preserve total water while reaching oxygen and minimum-flow targets.</desc>
<rect width="1600" height="900" fill="#0b111b"/>
<rect x="35" y="30" width="1530" height="840" rx="22" fill="#101b2b" stroke="#365064"/>
<g transform="translate(0,35)"><rect x="150" y="280" width="220" height="190" rx="14" fill="#101b2b" stroke="#a3e6c2" stroke-width="2"/><text x="260.0" y="382.0" font-family="Arial, sans-serif" font-size="21" fill="#a3e6c2" text-anchor="middle">1000 units</text><rect x="800" y="280" width="220" height="190" rx="14" fill="#101b2b" stroke="#a3e6c2" stroke-width="2"/><text x="910.0" y="382.0" font-family="Arial, sans-serif" font-size="21" fill="#a3e6c2" text-anchor="middle">FILTER</text><path d="M380,310 L790,310" fill="none" stroke="#75c6e9" stroke-width="6"/><circle cx="580" cy="310" r="34" fill="#101b2b" stroke="#d5bb72" stroke-width="3"/><text x="580" y="317" font-family="Arial, sans-serif" font-size="21" fill="#d5bb72" text-anchor="middle">V</text><path d="M380,440 L790,440" fill="none" stroke="#75c6e9" stroke-width="6"/><circle cx="580" cy="440" r="34" fill="#101b2b" stroke="#d5bb72" stroke-width="3"/><text x="580" y="447" font-family="Arial, sans-serif" font-size="21" fill="#d5bb72" text-anchor="middle">V</text><text x="580" y="240" font-family="Arial, sans-serif" font-size="23" fill="#dce7ef" text-anchor="middle">Two sealed bypass valves</text><text x="580" y="555" font-family="Arial, sans-serif" font-size="23" fill="#a3e6c2" text-anchor="middle">Flow&gt;=10 / oxygen&gt;=60 /24 s test</text><text x="580" y="595" font-family="Arial, sans-serif" font-size="20" fill="#94a6b8" text-anchor="middle">Preserve water and living filter material.</text></g>
<text x="75" y="80" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">MERIDIAN / OPERATION BRIEF</text><text x="75" y="130" font-family="Arial, sans-serif" font-size="34" fill="#dce7ef" text-anchor="start">The Blue Reservoir</text><text x="75" y="173" font-family="Arial, sans-serif" font-size="20" fill="#94a6b8" text-anchor="start">Closed fluid-flow balancing</text><path d="M75,195 L1525,195" fill="none" stroke="#365064" stroke-width="3"/><rect x="1130" y="225" width="395" height="430" rx="14" fill="#101b2b" stroke="#365064" stroke-width="2"/><text x="1160" y="260" font-family="Arial, sans-serif" font-size="19" fill="#d5bb72" text-anchor="start">TARGETS</text><text x="1160" y="300" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Water units: 1000</text><text x="1160" y="333" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Oxygen Min: 60</text><text x="1160" y="366" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Flow Min: 10</text><text x="1160" y="399" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Test s: 24</text><path d="M75,680 L1525,680" fill="none" stroke="#365064" stroke-width="3"/><text x="75" y="725" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">WHAT YOU DO</text><text x="75" y="765" font-family="Arial, sans-serif" font-size="23" fill="#dce7ef" text-anchor="start">Open/close the two source-owned sealed bypass valves; preserve total water while reaching oxygen and minimum-flow</text><text x="75" y="794" font-family="Arial, sans-serif" font-size="23" fill="#dce7ef" text-anchor="start">targets.</text><text x="75" y="850" font-family="Arial, sans-serif" font-size="17" fill="#94a6b8" text-anchor="start">Schematic briefing illustration. Not to scale; not a game capture. Values are test targets, not earned success.</text>
</svg>
