<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">The Open Shadow</title><desc id="desc">Privacy and collision-channel separation Fly the volunteer crossing through three actual approach lanes while measuring collision warning and identity disclosure separately.</desc>
<rect width="1600" height="900" fill="#0b111b"/>
<rect x="35" y="30" width="1530" height="840" rx="22" fill="#101b2b" stroke="#365064"/>
<g transform="translate(0,35)"><circle cx="550" cy="370" r="190" fill="#101b2b" stroke="#365064" stroke-width="3"/><text x="550" y="377" font-family="Arial, sans-serif" font-size="21" fill="#365064" text-anchor="middle">500 m warning zone</text><circle cx="550" cy="370" r="45" fill="#101b2b" stroke="#75c6e9" stroke-width="3"/><text x="550" y="377" font-family="Arial, sans-serif" font-size="21" fill="#75c6e9" text-anchor="middle">SENSOR</text><path d="M150,255 L950,255" fill="none" stroke="#a3e6c2" stroke-width="3"/><polygon points="950,255 939.4690092573155,260.75310646325045 939.4690092573155,249.24689353674955" fill="#a3e6c2"/><text x="160" y="237" font-family="Arial, sans-serif" font-size="18" fill="#94a6b8" text-anchor="start">Consented crossing 1</text><path d="M150,375 L950,375" fill="none" stroke="#a3e6c2" stroke-width="3"/><polygon points="950,375 939.4690092573155,380.75310646325045 939.4690092573155,369.24689353674955" fill="#a3e6c2"/><text x="160" y="357" font-family="Arial, sans-serif" font-size="18" fill="#94a6b8" text-anchor="start">Consented crossing 2</text><path d="M150,495 L950,495" fill="none" stroke="#a3e6c2" stroke-width="3"/><polygon points="950,495 939.4690092573155,500.75310646325045 939.4690092573155,489.24689353674955" fill="#a3e6c2"/><text x="160" y="477" font-family="Arial, sans-serif" font-size="18" fill="#94a6b8" text-anchor="start">Consented crossing 3</text><rect x="780" y="535" width="225" height="55" rx="14" fill="#101b2b" stroke="#d5bb72" stroke-width="2"/><text x="892.5" y="569.5" font-family="Arial, sans-serif" font-size="21" fill="#d5bb72" text-anchor="middle">Private fields:0</text><text x="180" y="590" font-family="Arial, sans-serif" font-size="20" fill="#dce7ef" text-anchor="start">Collision warning stays active; identity disclosure stays off.</text></g>
<text x="75" y="80" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">MERIDIAN / OPERATION BRIEF</text><text x="75" y="130" font-family="Arial, sans-serif" font-size="34" fill="#dce7ef" text-anchor="start">The Open Shadow</text><text x="75" y="173" font-family="Arial, sans-serif" font-size="20" fill="#94a6b8" text-anchor="start">Privacy and collision-channel separation</text><path d="M75,195 L1525,195" fill="none" stroke="#365064" stroke-width="3"/><rect x="1130" y="225" width="395" height="430" rx="14" fill="#101b2b" stroke="#365064" stroke-width="2"/><text x="1160" y="260" font-family="Arial, sans-serif" font-size="19" fill="#d5bb72" text-anchor="start">TARGETS</text><text x="1160" y="300" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Test Packets: 3</text><text x="1160" y="333" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Warning Distance m: 500</text><text x="1160" y="366" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Maximum Warning Latency s: 1</text><text x="1160" y="399" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Private Fields Allowed: 0</text><path d="M75,680 L1525,680" fill="none" stroke="#365064" stroke-width="3"/><text x="75" y="725" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">WHAT YOU DO</text><text x="75" y="765" font-family="Arial, sans-serif" font-size="23" fill="#dce7ef" text-anchor="start">Fly the volunteer crossing through three actual approach lanes while measuring collision warning and identity</text><text x="75" y="794" font-family="Arial, sans-serif" font-size="23" fill="#dce7ef" text-anchor="start">disclosure separately.</text><text x="75" y="850" font-family="Arial, sans-serif" font-size="17" fill="#94a6b8" text-anchor="start">Schematic briefing illustration. Not to scale; not a game capture. Values are test targets, not earned success.</text>
</svg>
