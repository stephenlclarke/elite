<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Mutual Shelter</title><desc id="desc">Finite emergency-capacity stress test Reserve two real shelter berths, present the third competing claim, verify its honest refusal and then release a real reservation.</desc>
<rect width="1600" height="900" fill="#0b111b"/>
<rect x="35" y="30" width="1530" height="840" rx="22" fill="#101b2b" stroke="#365064"/>
<g transform="translate(0,35)"><rect x="700" y="230" width="280" height="120" rx="14" fill="#101b2b" stroke="#a3e6c2" stroke-width="2"/><text x="840.0" y="297.0" font-family="Arial, sans-serif" font-size="21" fill="#a3e6c2" text-anchor="middle">Berth 1</text><rect x="700" y="450" width="280" height="120" rx="14" fill="#101b2b" stroke="#a3e6c2" stroke-width="2"/><text x="840.0" y="517.0" font-family="Arial, sans-serif" font-size="21" fill="#a3e6c2" text-anchor="middle">Berth 2</text><rect x="160" y="225" width="230" height="70" rx="14" fill="#101b2b" stroke="#75c6e9" stroke-width="2"/><text x="275.0" y="267.0" font-family="Arial, sans-serif" font-size="21" fill="#75c6e9" text-anchor="middle">Claim 1</text><path d="M405,260 L630,260" fill="none" stroke="#75c6e9" stroke-width="3"/><polygon points="630,260 619.4690092573155,265.75310646325045 619.4690092573155,254.24689353674955" fill="#75c6e9"/><rect x="160" y="350" width="230" height="70" rx="14" fill="#101b2b" stroke="#75c6e9" stroke-width="2"/><text x="275.0" y="392.0" font-family="Arial, sans-serif" font-size="21" fill="#75c6e9" text-anchor="middle">Claim 2</text><path d="M405,385 L630,385" fill="none" stroke="#75c6e9" stroke-width="3"/><polygon points="630,385 619.4690092573155,390.75310646325045 619.4690092573155,379.24689353674955" fill="#75c6e9"/><rect x="160" y="475" width="230" height="70" rx="14" fill="#101b2b" stroke="#75c6e9" stroke-width="2"/><text x="275.0" y="517.0" font-family="Arial, sans-serif" font-size="21" fill="#75c6e9" text-anchor="middle">Claim 3</text><path d="M405,510 L630,510" fill="none" stroke="#75c6e9" stroke-width="3"/><polygon points="630,510 619.4690092573155,515.7531064632504 619.4690092573155,504.24689353674955" fill="#75c6e9"/><circle cx="545" cy="385" r="35" fill="#101b2b" stroke="#df8d73" stroke-width="3"/><path d="M527,367 L563,403" fill="none" stroke="#df8d73" stroke-width="4"/><path d="M563,367 L527,403" fill="none" stroke="#df8d73" stroke-width="4"/><text x="545" y="450" font-family="Arial, sans-serif" font-size="18" fill="#df8d73" text-anchor="middle">THIRD CLAIM WAITS</text><text x="555" y="205" font-family="Arial, sans-serif" font-size="22" fill="#dce7ef" text-anchor="middle">Two real berths cannot cover three simultaneous claims</text></g>
<text x="75" y="80" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">MERIDIAN / OPERATION BRIEF</text><text x="75" y="130" font-family="Arial, sans-serif" font-size="34" fill="#dce7ef" text-anchor="start">Mutual Shelter</text><text x="75" y="173" font-family="Arial, sans-serif" font-size="20" fill="#94a6b8" text-anchor="start">Finite emergency-capacity stress test</text><path d="M75,195 L1525,195" fill="none" stroke="#365064" stroke-width="3"/><rect x="1130" y="225" width="395" height="430" rx="14" fill="#101b2b" stroke="#365064" stroke-width="2"/><text x="1160" y="260" font-family="Arial, sans-serif" font-size="19" fill="#d5bb72" text-anchor="start">TARGETS</text><text x="1160" y="300" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Real Berths: 2</text><text x="1160" y="333" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Simultaneous Claims: 3</text><text x="1160" y="366" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Maximum Granted Claims: 2</text><path d="M75,680 L1525,680" fill="none" stroke="#365064" stroke-width="3"/><text x="75" y="725" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">WHAT YOU DO</text><text x="75" y="765" font-family="Arial, sans-serif" font-size="23" fill="#dce7ef" text-anchor="start">Reserve two real shelter berths, present the third competing claim, verify its honest refusal and then release a</text><text x="75" y="794" font-family="Arial, sans-serif" font-size="23" fill="#dce7ef" text-anchor="start">real reservation.</text><text x="75" y="850" font-family="Arial, sans-serif" font-size="17" fill="#94a6b8" text-anchor="start">Schematic briefing illustration. Not to scale; not a game capture. Values are test targets, not earned success.</text>
</svg>
