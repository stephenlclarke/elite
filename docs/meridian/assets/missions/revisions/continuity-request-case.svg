<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Continuity inquiry</title><desc id="desc">Request case At the orbital desk, open a new source-linked inquiry and obtain a zero-mass signed survey mandate and three archive measurement challenges.</desc>
<rect width="1600" height="900" fill="#0b111b"/>
<rect x="35" y="30" width="1530" height="840" rx="22" fill="#101b2b" stroke="#365064"/>
<g transform="translate(0,35)"><rect x="150" y="250" width="310" height="120" rx="14" fill="#101b2b" stroke="#d5bb72" stroke-width="2"/><text x="305.0" y="317.0" font-family="Arial, sans-serif" font-size="21" fill="#d5bb72" text-anchor="middle">Original failure retained</text><path d="M475,310 L660,310" fill="none" stroke="#75c6e9" stroke-width="3"/><polygon points="660,310 649.4690092573155,315.75310646325045 649.4690092573155,304.24689353674955" fill="#75c6e9"/><rect x="680" y="250" width="340" height="120" rx="14" fill="#101b2b" stroke="#a3e6c2" stroke-width="2"/><text x="850.0" y="317.0" font-family="Arial, sans-serif" font-size="21" fill="#a3e6c2" text-anchor="middle">New independent inquiry</text><text x="580" y="495" font-family="Arial, sans-serif" font-size="25" fill="#dce7ef" text-anchor="middle">No fee / no stock / no reputation gate</text><text x="580" y="565" font-family="Arial, sans-serif" font-size="21" fill="#94a6b8" text-anchor="middle">Original fee, deaths and losses stay unchanged.</text></g>
<text x="75" y="80" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">MERIDIAN / OPERATION BRIEF</text><text x="75" y="130" font-family="Arial, sans-serif" font-size="34" fill="#dce7ef" text-anchor="start">Continuity inquiry</text><text x="75" y="173" font-family="Arial, sans-serif" font-size="20" fill="#94a6b8" text-anchor="start">Request case</text><path d="M75,195 L1525,195" fill="none" stroke="#365064" stroke-width="3"/><rect x="1130" y="225" width="395" height="430" rx="14" fill="#101b2b" stroke="#365064" stroke-width="2"/><text x="1160" y="260" font-family="Arial, sans-serif" font-size="19" fill="#d5bb72" text-anchor="start">TARGETS</text><text x="1160" y="300" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Required Source Count: 64</text><text x="1160" y="333" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Case Stages: 5</text><text x="1160" y="366" font-family="Arial, sans-serif" font-size="18" fill="#dce7ef" text-anchor="start">Commander Charge CR: 0</text><path d="M75,680 L1525,680" fill="none" stroke="#365064" stroke-width="3"/><text x="75" y="725" font-family="Arial, sans-serif" font-size="18" fill="#d5bb72" text-anchor="start">WHAT YOU DO</text><text x="75" y="765" font-family="Arial, sans-serif" font-size="23" fill="#dce7ef" text-anchor="start">At the orbital desk, open a new source-linked inquiry and obtain a zero-mass signed survey mandate and three</text><text x="75" y="794" font-family="Arial, sans-serif" font-size="23" fill="#dce7ef" text-anchor="start">archive measurement challenges.</text><text x="75" y="850" font-family="Arial, sans-serif" font-size="17" fill="#94a6b8" text-anchor="start">Schematic briefing illustration. Not to scale; not a game capture. Values are test targets, not earned success.</text>
</svg>
