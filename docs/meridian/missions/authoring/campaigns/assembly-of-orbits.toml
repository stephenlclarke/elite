# Private campaign design schema; not installed in the game.
id = "l337.assembly-of-orbits"
missionID = "assembly-of-orbits"
title = "An Assembly of Orbits"
originKind = "new-original"
subtitle = "VOSS: A share certificate cannot stand in for the people on the next shift."
contacts = ["Marshal Nera Voss", "Coordinator Sera Dain"]
ships = ["SH001", "SH061"]
offer = "At Irkenan in Galaxy 7, after one ordinary trade. No imported score gate or source campaign prerequisite. The reference loan needs one tonne of free hold."
story = "A cluster of orbital homes must share a single transfer corridor during a maintenance season. Old voting records count property shares but omit the crews who keep the corridor open. The commander verifies real occupancy and operating work, escorts delegates and establishes either rotating worker stewardship or publicly bounded berth representation."
playerBriefing = "VOSS: A share certificate cannot stand in for the people on the next shift."
rewardCR = 7700
completionBenefit = "The selected verified settlement persists in local records. No free hull, unrelated legal reset or artificial combat kills. A permanent clue for The Unwritten Route: The absent seat."
branchPolicy = "Store the selected plan-a or plan-b identity once, separately from its authored display label. Apply only that branch at apply-settlement; both distinct physical and receiving proofs are required. Both legitimate endings share one final reward and one source clue."
items = [{ id = "assembly-of-orbits-reference", massTonnes = 1, acquireStage = "collect-reference", consumeStage = "return-and-audit" }]
interactionNotes = ["Use the existing mission log, targeting, scan, contextual Confirm and Esc. Preview all obligations before accepting; cancellation changes nothing.", "Keep the reference instrument in reserved custody through the field work, witness reception and selected settlement. Returning it is part of the independent terminal audit.", "Preserve actual crew and entity identities. Culling is not death or arrival. A lost unnamed tender may be replaced with a new consenting crew after real rescue handling; never resurrect a named casualty. A lost reference invalidates its old serial before a real replacement loan.", "All objectives are space flight or space-station handoffs. Stations remain protected from single-ship weapons. No source world overrides, equipment budgets, hidden reputation grind or external storyline progress is required."]
