# Private campaign design schema; not installed in the game.
id = "l337.cold-reserve"
missionID = "cold-reserve"
title = "Cold Reserve"
originKind = "new-original"
subtitle = "PELL: Count what is here before anyone orders it somewhere else."
contacts = ["Marshal Nera Voss", "Salvage Chief Ruan Pell"]
ships = ["SH001", "SH061"]
offer = "At Fanerin in Galaxy 8, after one ordinary trade. No imported score gate or source campaign prerequisite. The reference loan needs one tonne of free hold."
story = "A decommissioned defence reserve is still paying for autonomous cargo movements under expired authority. Its unmanned equipment is still executing the expired dispatch orders. The commander reconciles finite stores, disconnects real dispatch couplers and escorts an inspection crew before choosing a civilian reserve conversion or verified dismantling."
playerBriefing = "PELL: Count what is here before anyone orders it somewhere else."
rewardCR = 8800
completionBenefit = "The selected verified settlement persists in local records. No free hull, unrelated legal reset or artificial combat kills. A permanent clue for The Unwritten Route: The unused order."
branchPolicy = "Store the selected plan-a or plan-b identity once, separately from its authored display label. Apply only that branch at apply-settlement; both distinct physical and receiving proofs are required. Both legitimate endings share one final reward and one source clue."
items = [{ id = "cold-reserve-reference", massTonnes = 1, acquireStage = "collect-reference", consumeStage = "return-and-audit" }]
interactionNotes = ["Use the existing mission log, targeting, scan, contextual Confirm and Esc. Preview all obligations before accepting; cancellation changes nothing.", "Keep the reference instrument in reserved custody through the field work, witness reception and selected settlement. Returning it is part of the independent terminal audit.", "Preserve actual crew and entity identities. Culling is not death or arrival. A lost unnamed tender may be replaced with a new consenting crew after real rescue handling; never resurrect a named casualty. A lost reference invalidates its old serial before a real replacement loan.", "All objectives are space flight or space-station handoffs. Stations remain protected from single-ship weapons. No source world overrides, equipment budgets, hidden reputation grind or external storyline progress is required."]
authoringArt = { propID = "cold-reserve-reference", propForm = "storage", palette = "sand-graphite", stageObjects = ["cold-reserve-reference", "cold-reserve-reference", "cold-reserve-reference", "cold-reserve-reference", "SH061", "cold-reserve-reference", "cold-reserve-reference", "cold-reserve-reference", "cold-reserve-reference"] }
schema = "l337-mission-design/1"
version = "1.0.0"
license = "MIT"
status = "Private original story and stage design; not a runnable pack for the current engine"
authoredSource = "Original L337 narrative, objectives, dialogs, locations and rewards"
terminalStage = "complete"
rewardReceipt = "l337.cold-reserve/final-payment"
rewardPolicy = "Pay credits once, atomically with the terminal receipt. Delay optional equipment fitting if incompatible; offer it again without duplicating payment. Never award kill points for non-kills or clear unrelated legal status. Commit the clue and terminal reward receipt atomically; a pending optional fitting does not delay the clue."
identityPolicy = "Match locations by galaxy/system identity, not coordinates or displayed spelling. Match entities by mission instance and target ID, never merely ship type."
persistencePolicy = "Every campaign starts unaccepted with its current identity and zero progress. Persist current-format stage evidence, choices, mission-item custody, reward and clue receipts. Resume these records on load; replayed events cannot duplicate rewards. No previous campaign or save format is imported."
engineWork = "Implement/verify the event contracts in ENGINE-CONTRACT.md before declaring this pack playable. Current native special-case bindings are superseded by mission-scoped events in the proposed version."
completionClue = { questID = "l337.unwritten-route", clueID = "cold-reserve-trace", label = "The unused order", journalText = "An expired dispatch order defines an inward route to a receiving volume that has never existed in the reserve.", massTonnes = 0, uniquePerSource = true, receipt = "l337.unwritten-route/clue/cold-reserve-trace", awardWithSuccessfulTerminal = true }
