# Private campaign design schema; not installed in the game.
id = "l337.blue-reservoir"
missionID = "blue-reservoir"
title = "The Blue Reservoir"
originKind = "new-original"
subtitle = "LERR: Clean intake water says nothing about what the circulation loop keeps from returning."
contacts = ["Engineer Cato Lerr", "Custodian Tomas Veil"]
ships = ["SH001", "SH061"]
offer = "At Bornolom in Galaxy 4, after one ordinary trade. No imported score gate or source campaign prerequisite. The reference loan needs one tonne of free hold."
story = "An orbital water commons is losing dissolved oxygen while every intake remains clean. A new circulation pump has trapped part of the living filter behind a one-way lease boundary. The commander measures actual flow, opens consented bypasses and chooses distributed filter cradles or a jointly governed reservoir."
playerBriefing = "LERR: Clean intake water says nothing about what the circulation loop keeps from returning."
rewardCR = 7300
completionBenefit = "The selected verified settlement persists in local records. No free hull, unrelated legal reset or artificial combat kills. A permanent clue for The Unwritten Route: The dry current."
branchPolicy = "Store the selected plan-a or plan-b identity once, separately from its authored display label. Apply only that branch at apply-settlement; both distinct physical and receiving proofs are required. Both legitimate endings share one final reward and one source clue."
items = [{ id = "blue-reservoir-reference", massTonnes = 1, acquireStage = "collect-reference", consumeStage = "return-and-audit" }]
interactionNotes = ["Use the existing mission log, targeting, scan, contextual Confirm and Esc. Preview all obligations before accepting; cancellation changes nothing.", "Keep the reference instrument in reserved custody through the field work, witness reception and selected settlement. Returning it is part of the independent terminal audit.", "Preserve actual crew and entity identities. Culling is not death or arrival. A lost unnamed tender may be replaced with a new consenting crew after real rescue handling; never resurrect a named casualty. A lost reference invalidates its old serial before a real replacement loan.", "All objectives are space flight or space-station handoffs. Stations remain protected from single-ship weapons. No source world overrides, equipment budgets, hidden reputation grind or external storyline progress is required."]
authoringArt = { propID = "blue-reservoir-reference", propForm = "water", palette = "ivory-teal", stageObjects = ["blue-reservoir-reference", "blue-reservoir-reference", "blue-reservoir-reference", "blue-reservoir-reference", "SH061", "blue-reservoir-reference", "blue-reservoir-reference", "blue-reservoir-reference", "blue-reservoir-reference"] }
