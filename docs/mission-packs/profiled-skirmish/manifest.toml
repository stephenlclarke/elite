schemaVersion = 2
missionAPI = 2
id = "example.profiled-skirmish"
version = "1.0.1"
minimumEngine = "2.0.0"
capabilities = ["script-lua-v1", "story-v2", "economy-v2", "profiled-encounters-v2", "gallery-basic-v2", "pack-modules-v2"]
priority = 600
source = "Original physical NPC/component demonstration. Declared figures are project example values, not historical ship specifications or full Oolite combat parity."
license = "MIT"
environments = ["space", "orbital-station"]
module = "scripts/main.lua"

[mission]
id = "skirmish"
title = "Profiled skirmish demonstration"
briefing = "Launch at Lave and defeat the two assigned training opponents. Their separate NPC fits, measured models, working turret and damage are saved. Return to Lave orbital station and confirm your report."
destination = "Galaxy 1, Lave (system 7)"
reward = "100 credits, plus declared native combat bounties."
milestones = ["Accept skirmish", "Defeat both assigned ships", "Report at Lave orbital station"]
requiredDestructionEncounters = ["opponents"]

[trial]
ship = "SH023"
galaxy = 0
system = 7
credits = 10000
cabins = 0
flight = true

[[handlers]]
event = "mission.accepted"
function = "accepted"
[[handlers]]
event = "station.undocked"
function = "undocked"
[[handlers]]
event = "encounter.admitted"
function = "admitted"
[[handlers]]
event = "actor.destroyed"
function = "destroyed"
[[handlers]]
event = "contact.requested"
function = "contact"
[[handlers]]
event = "dialogue.confirmed"
function = "confirm"

[[dialogs]]
id = "report"
text = "Both actual training opponents were destroyed. Confirm your report and collect 100 credits."

