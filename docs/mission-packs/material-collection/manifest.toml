schemaVersion = 2
missionAPI = 2
id = "example.material-collection"
version = "1.0.0"
minimumEngine = "2.0.0"
capabilities = ["script-lua-v1", "story-v2", "partial-collections-v2", "gallery-basic-v2"]
priority = 470
source = "Original materials handoff demonstration, using native commodity quantities; not the historical Iron Raven campaign."
license = "MIT"
environments = ["space", "orbital-station"]
module = "scripts/main.lua"

[mission]
id = "materials"
title = "Orbital materials collection demonstration"
briefing = "Deliver requested trade goods to Lave's main orbital station in as many trips as needed. Only the outstanding unreserved quantities are accepted. Review the native quantities before each Confirm."
destination = "Lave main orbital station"
reward = "Recorded materials handoff; no credits."
milestones = ["Deliver the requested materials"]
requiredCollections = ["materials"]

[[handlers]]
event = "mission.accepted"
function = "accepted"
[[handlers]]
event = "contact.requested"
function = "contact"
[[handlers]]
event = "dialogue.confirmed"
function = "confirm"

[[dialogs]]
id = "handoff"
text = "Confirm transfers only the available outstanding goods shown below. Excess and protected mission cargo remain aboard. Back transfers nothing."
collection = "materials"

[[collections]]
id = "materials"
title = "Station workshop materials"
galaxy = 0
system = 7
items = [
  {commodity=2, unit="t", quantity=10},
  {commodity=9, unit="t", quantity=5},
  {commodity=12, unit="t", quantity=2},
  {commodity=16, unit="t", quantity=2},
  {commodity=14, unit="kg", quantity=1}
]

[trial]
ship = "SH023"
galaxy = 0
system = 7
credits = 1000000
cabins = 0
flight = false
