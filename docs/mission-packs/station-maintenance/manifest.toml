  {id="support-viper", hull="viper", x=0.0, y=500.0, z=3000.0, hostile=false},
  {id="support-cobra", hull="cobra", x=1000.0, y=500.0, z=4500.0, hostile=false}
]

[[worldJobs]]
id = "patrol-service"
title = "Station training patrol service"
handler = "maintenance"
owner = "station"
galaxy = 0
system = 7
firstDue = 0
interval = 1
policy = "skip"
counters = ["opening"]
