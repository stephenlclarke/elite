schemaVersion = 2
missionAPI = 2
id = "example.station-conversation"
version = "1.0.0"
minimumEngine = "2.0.0"
capabilities = ["script-lua-v1", "story-v2", "dialogue-choices-v2", "gallery-basic-v2"]
priority = 450
source = "Original repeatable station conversation demonstration; not a historical Elite mission or a loan service."
license = "MIT"
environments = ["space", "orbital-station"]
module = "scripts/main.lua"

[mission]
id = "decision"
title = "Repeatable station conversation demonstration"
briefing = "At Lave Mission Contacts, you may defer your decision and return later. Read the details through the actual Details choice, then Confirm Proceed. Back, Help and reading the preview do not answer a question. This demonstration changes no money, cargo or equipment."
destination = "Lave main orbital station"
reward = "Recorded conversation; no payment."
milestones = ["Read details and confirm proceeding"]

[[answerRequirements]]
dialogue = "decision"
choice = "details"
minimumCount = 1
[[answerRequirements]]
dialogue = "decision"
choice = "proceed"
minimumCount = 1

[[handlers]]
event = "mission.accepted"
function = "accepted"
[[handlers]]
event = "contact.requested"
function = "contact"
[[handlers]]
event = "dialogue.confirmed"
function = "confirm"

[[dialogs]]
id = "decision"
text = "Choose Defer to leave the decision open, Details to record that you asked for the information, or Proceed after asking for details. Each answer requires Confirm. Back leaves the current question unanswered."
choices = [
  {id="defer", label="Defer: keep the decision available for a later visit"},
  {id="details", label="Details: ask for the assignment information"},
  {id="proceed", label="Proceed: confirm after reading the details"}
]

[trial]
ship = "SH023"
galaxy = 0
system = 7
credits = 1000
cabins = 0
flight = false
