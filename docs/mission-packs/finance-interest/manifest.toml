schemaVersion = 2
missionAPI = 2
id = "example.finance-interest"
version = "1.0.0"
minimumEngine = "2.0.0"
capabilities = ["script-lua-v1", "story-v2", "durable-commands-v2", "finance-obligations-basic-v2", "finance-interest-simple-v2", "mission-calendar-v2", "gallery-basic-v2"]
priority = 480
source = "Original capped simple-interest demonstration; not a historical GSE or Bank of the Black Monks profile."
license = "MIT"
environments = ["space", "orbital-station"]
module = "scripts/main.lua"

[mission]
id = "loan"
title = "Capped simple-interest loan"
briefing = "Optional 200.0 CR loan: 10% per completed 86400-second calendar period, rounded up per period to 0.1 CR, with at most 100.0 CR lifetime interest. Periods begin at explicit Borrow. Only remaining principal earns interest, never unpaid interest; partial payments clear interest first and never restart the period clock. Launch and return through this system's real original main doorway, then use Finance in Station Contracts to Borrow or Repay. Native travel advances the calendar; wall-clock time and reading menus do not."
destination = "This system's original main orbital station"
reward = "Optional loan, not a reward. No automatic debit, deadline, escrow or collection AI."
milestones = ["Review the optional loan, then speak to Mission Contacts after borrowing"]

[[handlers]]
event = "mission.accepted"
function = "accepted"
[[handlers]]
event = "contact.requested"
function = "contact"

[[loans]]
id = "workshop"
profile = "simple-interest-v1"
creditor = "example.period-lender"
title = "Capped workshop loan"
principal = 2000
galaxy = 0
system = 237

[loans.interest]
rateBasisPoints = 1000
periodSeconds = 86400
rounding = "up"
maximumInterest = 1000

[trial]
ship = "SH023"
galaxy = 0
system = 237
credits = 1000
cabins = 0
flight = false
