schemaVersion = 2
missionAPI = 2
id = "example.scripted-courier"
version = "1.0.0"
minimumEngine = "2.0.0"
capabilities = ["script-lua-v1", "story-v2", "economy-v2", "cargo-v2"]
priority = 500
source = "Original engine demonstration; not a historical Elite mission."
license = "MIT"
environments = ["space", "orbital-station"]
module = "scripts/main.lua"

[mission]
id = "courier"
title = "Scripted courier demonstration"
briefing = "Carry one tonne of sealed supplies to Zaonce in Galaxy 1. Accepting requires one free tonne. Visit Mission Contacts at Zaonce's main orbital station to deliver."
destination = "Galaxy 1, Zaonce (system 129)"
reward = "50 credits on confirmed delivery."
milestones = ["Collect sealed supplies", "Deliver at Zaonce orbital station"]

[[handlers]]
event = "mission.accepted"
function = "accepted"

[[handlers]]
event = "contact.requested"
function = "contact"

[[handlers]]
event = "dialogue.confirmed"
function = "confirm"

[[dialogs]]
id = "delivery"
text = "The station will receive your sealed supplies and pay 50 credits. Confirm to transfer the parcel and collect payment."
