schemaVersion = 2
missionAPI = 2
id = "example.linked-patrol"
version = "1.0.0"
minimumEngine = "2.0.0"
capabilities = ["script-lua-v1", "story-v2", "completion-receipts-v2", "commander-queries-v2", "gallery-basic-v2"]
priority = 550
source = "Original native receipt join demonstration; not a historical Elite campaign. Install alongside the exact scripted-patrol example."
license = "MIT"
environments = ["space", "orbital-station"]
module = "scripts/main.lua"

[mission]
id = "debrief"
title = "Linked patrol debrief demonstration"
briefing = "Accept this debrief and the separate scripted patrol at Lave. Fly the actual patrol, defeat its two assigned raiders and confirm its station report. Then return to Mission Contacts for this separate debrief. The patrol's installed files, story flags and unreported kills do not qualify."
destination = "Lave main orbital station"
reward = "Recorded debrief; no additional payment."
milestones = ["Join the genuine patrol report"]

[[receiptRequirements]]
id = "patrol-report"
stage = "completion"
definition = "example.scripted-patrol/patrol"
version = "1.0.0"
digest = "f7c2123ea24e13e6d8e613a72270a052ae6b5a010e4edb678ab10a239f185906"
outcome = "complete"
minimumCount = 1

[[handlers]]
event = "mission.accepted"
function = "accepted"
[[handlers]]
event = "mission.receipted"
function = "receipted"
[[handlers]]
event = "contact.requested"
function = "contact"
[[handlers]]
event = "dialogue.confirmed"
function = "confirm"

[[dialogs]]
id = "debrief"
text = "Your genuine patrol report is recorded. Confirm to close this separate debrief. No additional payment is due."

