schemaVersion = 2
missionAPI = 2
id = "project.generated-supplied-freight"
version = "1.0.0"
minimumEngine = "2.0.0"
capabilities = ["script-lua-v1", "story-v2", "local-flight-clocks-v2", "contracts-basic-v2", "freight-contracts-basic-v2", "mission-calendar-v2", "durable-commands-v2", "partial-collections-v2", "dialogue-choices-v2", "gallery-basic-v2"]
priority = 565
source = "PROJECT-SPACE-G03-1 freight variant, approved project adaptation of S10/S18/D03/D04/O08 in generated-space-project-profiles.json. Quantities, payment, deadlines and generation are PROJECT ESTIMATES, not recovered live-server distributions. This complementary pack supplies issuer-owned freight; the procurement variant remains separate."
license = "MIT"
environments = ["space", "orbital-station"]
module = "scripts/main.lua"

[mission]
id = "freight"
title = "Supplied freight jobs"
briefing = "The issuer supplies unique owned tonnes of Food, Textiles or Machinery at acceptance. Deliver the same units at the named destination main station. Real partial lots are retained. Only the final native handoff pays. Estimates are project balance values."
destination = "Frozen destination main orbital / Supplied freight Receiving Officer"
reward = "Frozen tier base plus 300 CR per required hop, once after all goods are received. PROJECT ESTIMATES."
milestones = ["Deliver the entire frozen native material requirement"]
requiredCollections = ["freight-goods"]

[board]
id = "freight-jobs"
title = "Supplied freight jobs / PROJECT ESTIMATES"
generator = "generate"
clock = "missionCalendar"
refreshSeconds = 3600
exclusiveGroup = "g03-freight"

[freight]
profile = "PROJECT-SPACE-G03-1"
generatorRevision = 1
variant = "supplied"
deliveryContact = "freight-delivery"
abandonContact = "freight-abandon"

[freight.collectionTemplate]
id = "freight-goods"
title = "Requested freight goods"

[[dialogs]]
id = "freight-delivery"
text = "Supplied freight Receiving Officer: choose one tonne or all remaining issuer-owned freight, then confirm. Earlier partial receipts remain recorded. Only the entire frozen requirement earns its single payment. Back changes nothing."
collection = "freight-goods"

[[dialogs.choices]]
id = "freight-one"
label = "Deliver one tonne"

[[dialogs.choices]]
id = "freight-all"
label = "Deliver all remaining freight"

[[dialogs]]
id = "freight-abandon"
text = "Supplied freight Dispatch Officer: confirm abandonment for 0 CR. Earlier partial deliveries remain recorded; remaining issuer-owned units are returned; ordinary cargo stays yours. Back changes nothing."

[[handlers]]
event = "mission.accepted"
function = "accepted"
[[handlers]]
event = "contact.requested"
function = "contact"

[trial]
ship = "SH023"
galaxy = 0
system = 7
credits = 100000
cabins = 0
flight = true
offer = 0
