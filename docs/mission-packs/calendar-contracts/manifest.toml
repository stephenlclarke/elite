schemaVersion = 2
missionAPI = 2
id = "example.calendar-contracts"
version = "1.0.0"
minimumEngine = "2.0.0"
capabilities = ["script-lua-v1", "story-v2", "cargo-v2", "local-flight-clocks-v2", "calendar-clocks-v2", "contracts-basic-v2", "durable-commands-v2"]
priority = 500
source = "Original commander-calendar station-board demonstration; not historical Elite or RRS content. Main orbital stations only."
license = "MIT"
environments = ["space", "orbital-station"]
module = "scripts/main.lua"

[mission]
id = "sample-run"
title = "Calendar delivery contracts demonstration"
briefing = "Read generated offers on Game > Station Contracts. Each accepted run carries its own sealed samples, deposit, reward, original offering station and acceptance-relative deadline. A direct jump with sufficient fuel is required before acceptance. Late samples must still be handed in at the destination; late work is failed without payment or a deposit refund. To cancel accepted work, return the original samples through Mission Contacts at the original offering station; cancellation forfeits the deposit."
destination = "Frozen independently in each generated offer."
reward = "Frozen independently in each generated offer."
milestones = ["Accept sealed samples", "Hand in the actual samples"]

[board]
id = "sample-couriers"
title = "Calendar sample couriers"
generator = "generate"
clock = "calendar"
refreshSeconds = 3600
exclusiveGroup = "sample-work"

[[handlers]]
event = "mission.accepted"
function = "accepted"

[[handlers]]
event = "contact.requested"
function = "contact"

[[handlers]]
event = "dialogue.confirmed"
function = "confirm"

[[handlers]]
event = "timer.fired"
function = "expired"

[[dialogs]]
id = "deliver-samples"
text = "Confirm to hand in this contract's original sealed samples. On-time delivery pays the frozen reward and refunds its deposit. Late delivery settles as failed, with no reward or deposit refund. Other assignments are untouched."

[[dialogs]]
id = "cancel-samples"
text = "Cancel this accepted run and return its original samples to this offering station. The deposit is forfeited, and no reward is paid. Other offers and assignments are untouched. Confirm to cancel; Back keeps the active job and cargo."
