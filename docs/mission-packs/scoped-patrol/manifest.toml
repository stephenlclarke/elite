schemaVersion = 2
missionAPI = 2
id = "example.scoped-patrol"
version = "1.0.0"
minimumEngine = "2.0.0"
capabilities = ["script-lua-v1", "story-v2", "completion-receipts-v2", "scoped-campaigns-basic-v2", "gallery-basic-v2"]
priority = 540
source = "Original campaign ownership demonstration; not a historical Elite campaign. Requires the exact scripted-patrol example."
license = "MIT"
environments = ["space", "orbital-station"]
module = "scripts/main.lua"

[mission]
id = "campaign"
title = "Owned patrol campaign demonstration"
briefing = "Accept to start a patrol owned by this campaign. Launch at Lave, defeat its two assigned raiders and confirm their station report. Then confirm this campaign's debrief. A separate patrol's report cannot satisfy this campaign."
destination = "Lave main orbital station"
reward = "The child patrol's own reward; no additional debrief payment."
milestones = ["Debrief the owned patrol"]

[[children]]
id = "patrol"
definition = "example.scripted-patrol/patrol"
version = "1.0.0"
digest = "f7c2123ea24e13e6d8e613a72270a052ae6b5a010e4edb678ab10a239f185906"
terminalPolicy = "suspend"

[[receiptRequirements]]
id = "owned-report"
child = "patrol"
stage = "completion"
definition = "example.scripted-patrol/patrol"
version = "1.0.0"
digest = "f7c2123ea24e13e6d8e613a72270a052ae6b5a010e4edb678ab10a239f185906"
outcome = "complete"
minimumCount = 1

[[handlers]]
event = "mission.accepted"
function = "accepted"
[[handlers]]
event = "campaign.child.started"
function = "started"
[[handlers]]
event = "mission.receipted"
function = "receipted"
[[handlers]]
event = "contact.requested"
function = "contact"
[[handlers]]
event = "dialogue.confirmed"
function = "confirm"
[[handlers]]
event = "mission.abandoned"
function = "abandoned"

[[dialogs]]
id = "debrief"
text = "This campaign's actual patrol report is recorded. Confirm to close its debrief. No extra payment is due."

[trial]
ship = "SH023"
galaxy = 0
system = 7
credits = 1000
cabins = 0
flight = false
