schemaVersion = 2
missionAPI = 2
id = "example.reference-book"
version = "1.0.0"
minimumEngine = "2.0.0"
capabilities = ["script-lua-v1", "story-v2", "library-books-basic-v2", "gallery-basic-v2"]
priority = 460
source = "Original station reference demonstration written for this engine; not a historical Elite book."
license = "MIT"
environments = ["space", "orbital-station"]
module = "scripts/main.lua"

[mission]
id = "briefing"
title = "Reference book briefing demonstration"
briefing = "Confirm the reference briefing at Lave's orbital station to receive station field notes. The notes remain in Mission Library after the briefing is complete."
destination = "Lave main orbital station"
reward = "Station field notes; no credits."
milestones = ["Receive the reference briefing"]
requiredBooks = ["field-notes"]

[[handlers]]
event = "mission.accepted"
function = "accepted"
[[handlers]]
event = "contact.requested"
function = "contact"
[[handlers]]
event = "dialogue.confirmed"
function = "confirm"

[[dialogs]]
id = "briefing"
text = "Confirm to receive the station field notes. Open Mission Library from the Game menu to read them now or on a later visit."

[[books]]
id = "field-notes"
title = "Station field notes"
chapters = [
  {id="welcome", title="Welcome to the station", level=0, text="These notes are a reference for station pilots. Keep them for future visits.\n\nMission Contacts handles assignments; the library holds the accompanying information."},
  {id="preparation", title="Preparing a flight", level=1, text="Check your destination, fuel and current load before accepting an assignment. A route must fit the jump range and available fuel of the ship you actually fly.\n\nPassengers need compatible available cabins. Fitted cabins and mission freight use space in the hold. Equipment also needs compatible fittings. The shipyard comparison helps you review the resulting fit before changing ships.\n\nPersonal equipment that cannot fit a new hull can remain in storage for later use. Occupied cabins and protected mission property need a valid transfer plan.\n\nA contract briefing records its destination, deposit, deadline and settlement terms. Review the assignment before accepting it. Check the current load again when an offer changes or you select another ship.\n\nKeep ordinary trade goods separate from protected mission freight. Only actual compatible space can carry a new passenger party or reserved delivery."},
  {id="records", title="Keeping reference records", level=1, text="Return to the contents to choose another chapter. The source panel retains the edition and licence of these notes.\n\nYou can keep this reference after the original briefing is finished."}
]

[trial]
ship = "SH023"
galaxy = 0
system = 7
credits = 1000
cabins = 0
flight = false
